# CI reference — the repo assembles its own .github/ from infra/ with this file: the features it ships
# for itself and the tokens its fragments need. Edit the reference, not the output (`make maintain`).

features: [repo-ci, repo-maintain]

tokens:
  brand: e-templates
  allowlist: '(stack/[^/]+/[^/]+/.*|stack/README\.md|systems/[^/]+/(src|tests|docs)/.*|systems/[^/]+/README\.md|CHANGELOG\.md|README\.md)'
  verify: make check
