# CI reference — the repo assembles its own .github/ from infra/ with this file: the features it ships
# for itself and the tokens its fragments need. Edit the reference, not the output (e-taxis assembles it).

features: [repo-ci, repo-maintain, snap-refresh]

tokens:
  brand: e-arkhetypo
  repo: damvolkov/e-arkhetypo
  allowlist: '(stack/[^/]+/[^/]+/.*|stack/README\.md|projects/python/[^/]+/(src|tests|docs)/.*|projects/python/[^/]+/README\.md|CHANGELOG\.md|README\.md)'
  verify: make check
  snap_dir: graph
  snap_ui_pkg: projects/python/graph/src/e_graph/ui/package.json
