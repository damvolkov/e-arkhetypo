name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # feature: repo-ci
  ecosystem:
    name: every system's CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # the queue and postgres tests run on the stack's ParadeDB, at the port the tests default to.
    services:
      paradedb:
        image: paradedb/paradedb:v0.26.4-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 45011:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/common/.python-version)" >> "$GITHUB_ENV"
      ### the templates are frozen (only projects/python/common changes): CI holds common alone.
      - name: Sync common
        run: make -C projects/python/common install
      - name: make ci in common
        run: make -C projects/python/common ci

  # feature: repo-ci
  repo-gates:
    name: repo drift gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/common/.python-version)" >> "$GITHUB_ENV"
      - name: workflow hardening scan
        run: uvx zizmor@1.30.1 --persona=regular .github/workflows

  # feature: repo-maintain
  upstream-context-repo:
    name: what the update changed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Diff every system's pyproject against the base branch and merge the facts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          mkdir -p upstream-context parts
          FILES=$(git diff --name-only "$BASE" | grep -E '^projects/python/[^/]+/pyproject\.toml$' || true)
          for f in $FILES; do
            git show "$BASE:$f" > /tmp/base-pyproject.toml
            uv run --no-project python .github/tools/upstream.py --base /tmp/base-pyproject.toml --head "$f" --output "parts/$f"
          done
          for name in versions.txt release-notes.md api-added.txt; do
            cat parts/*/"$name" > "upstream-context/$name" 2>/dev/null || : > "upstream-context/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: upstream-context
          path: upstream-context/

