name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # feature: repo-ci
  ecosystem:
    name: every system's CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # the queue and postgres tests run on the stack's ParadeDB, at the port the tests default to.
    services:
      paradedb:
        image: paradedb/paradedb:0.26.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 45011:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/infra/.python-version)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: projects/python/graph/src/e_graph/ui/package.json
      - name: Materialize and sync every project (infra/ops/adapters and the shared root files are generated, not committed)
        run: |
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            make -C "$d" install
          done
      - name: make ci in every system, one by one, reporting all failures
        run: |
          STATUS=0
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            printf '\n### %s\n' "$d"
            make -C "$d" ci || STATUS=1
          done
          exit "$STATUS"

  # feature: repo-ci
  repo-gates:
    name: repo drift gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/infra/.python-version)" >> "$GITHUB_ENV"
      - name: Materialize every project, then prove nothing drifted from infra (generated trees are not committed)
        run: |
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            if grep -q '^infra:' "$d/Makefile"; then make -C "$d" infra infra-check; fi
          done
      - name: workflow hardening scan
        run: uvx zizmor@1.30.1 --persona=regular .github/workflows

  # feature: repo-maintain
  upstream-context-repo:
    name: what the update changed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Diff every system's pyproject against the base branch and merge the facts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          mkdir -p upstream-context parts
          FILES=$(git diff --name-only "$BASE" | grep -E '^projects/python/[^/]+/pyproject\.toml$' || true)
          for f in $FILES; do
            git show "$BASE:$f" > /tmp/base-pyproject.toml
            uv run --no-project python .github/tools/upstream.py --base /tmp/base-pyproject.toml --head "$f" --output "parts/$f"
          done
          for name in versions.txt release-notes.md api-added.txt; do
            cat parts/*/"$name" > "upstream-context/$name" 2>/dev/null || : > "upstream-context/$name"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: upstream-context
          path: upstream-context/

