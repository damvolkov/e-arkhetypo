    <rect x="123" y="832" width="124" height="13"/>
    <rect x="113" y="851" width="144" height="11"/>
  </g>
  <!-- e-taxis: the order — a bridge, one bank to the other -->
  <g fill="#166b7e">
    <rect x="769" y="741" width="140" height="15"/>
    <rect x="775" y="756" width="15" height="72"/>
    <rect x="888" y="756" width="15" height="72"/>
