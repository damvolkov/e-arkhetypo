<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the triumvirate: mind, archetypes, order">
  <rect width="1024" height="1024" fill="#060c15"/>
