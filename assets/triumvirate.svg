    <path d="M464 210 q12 8 4 18"/>
    <path d="M552 176 q-12 8 -2 20"/>
    <path d="M560 210 q-12 8 -4 18"/>
  </g>
  <!-- e-arkhetypo: the archetypes — a column, the ideal form -->
  <g fill="#166b7e">
    <path d="M185 703 L247 739 L123 739 Z"/>
    <rect x="123" y="745" width="124" height="13"/>
    <rect x="139" y="764" width="17" height="62"/>
