    <circle cx="185" cy="775" r="132"/>
    <circle cx="839" cy="775" r="132"/>
  </g>
  <!-- e-nous: the mind — a brain: two hemispheres, one fissure between them -->
  <g fill="#166b7e">
    <path d="M506 146 C488 138 468 146 464 162 C446 164 436 182 444 196 C434 208 438 228 452 234 C452 250 468 258 482 252 C490 258 500 258 506 252 Z"/>
    <path d="M518 146 C536 138 556 146 560 162 C578 164 588 182 580 196 C590 208 586 228 572 234 C572 250 556 258 542 252 C534 258 524 258 518 252 Z"/>
