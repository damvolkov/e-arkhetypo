  coverage:
    name: rust coverage ≥ {{coverage_floor}}%
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941  # v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Run the Python suite under llvm-cov
        run: |
          rustup component add llvm-tools-preview
          uv sync
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          python .github/tools/coverage.py lcov.info {{coverage_floor}}
