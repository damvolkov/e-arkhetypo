  ecosystem:
    name: every system's CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # the queue and postgres tests run on the stack's ParadeDB, at the port the tests default to.
    services:
      paradedb:
        image: paradedb/paradedb:0.26.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 45011:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/common/.python-version)" >> "$GITHUB_ENV"
      ### the templates are frozen (only projects/python/common changes): CI holds common alone.
      - name: Sync common
        run: make -C projects/python/common install
      - name: make ci in common
        run: make -C projects/python/common ci
