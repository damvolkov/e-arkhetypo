  ecosystem:
    name: every system's CI
    runs-on: ubuntu-latest
    # the queue and postgres tests run on the stack's ParadeDB, at the port the tests default to.
    services:
      paradedb:
        image: paradedb/paradedb:0.26.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 45011:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/core/common/python-version)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b  # v6.1.0
        with:
          package_json_file: projects/python/graph/src/e_graph/ui/package.json
      - name: Materialize and sync every project (core/ops/common and .python-version are generated, not committed)
        run: |
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            make -C "$d" install
          done
      - name: make ci in every system, one by one, reporting all failures
        run: |
          STATUS=0
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            printf '\n### %s\n' "$d"
            make -C "$d" ci || STATUS=1
          done
          exit "$STATUS"
