  repo-gates:
    name: repo drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Pin the Python the ecosystem declares
        run: echo "UV_PYTHON=$(cat projects/python/core/common/python-version)" >> "$GITHUB_ENV"
      - name: Materialize every project, then prove nothing drifted from core (generated trees are not committed)
        run: |
          for d in projects/python/*/; do
            [ -f "$d/Makefile" ] || continue
            if grep -q '^core:' "$d/Makefile"; then make -C "$d" core common core-check common-check; else make -C "$d" common common-check; fi
          done
      - name: workflow hardening scan
        run: uvx zizmor@1.30.1 --persona=regular .github/workflows
