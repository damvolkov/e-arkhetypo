  snapshots:
    name: visual snapshots
    if: vars.UI_SNAPSHOTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - uses: pnpm/action-setup@ea17c68dd4779f8e5e33de819d3248531c173f54  # v6.1.0
      - uses: actions/setup-node@8207627869665102c684bd7f7264caab499c3cdf  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: {{ui_dir}}/pnpm-lock.yaml
      - name: Bundle the UI, install the browser, run the acceptance pass
        run: |
          pnpm -C {{ui_dir}} install --frozen-lockfile
          pnpm -C {{ui_dir}} build
          uv sync
          uv run playwright install --with-deps chromium
          uv run pytest tests/acceptance -m ui -q
