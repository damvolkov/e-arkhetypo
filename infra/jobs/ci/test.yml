  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: {{os}}
        python: {{python}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Sync env
        run: uv sync --python ${{ matrix.python }}
      - name: Unit tests + coverage gate
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          uv run pytest -m "{{markers}}" --cov --cov-report=term 2>&1 | tee ci-logs/build-test.log
      - name: Keep the log for ai-fix
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-logs/
