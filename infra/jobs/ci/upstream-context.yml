  upstream-context:
    name: what the update changed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Collect release notes and version facts for the updated dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          git show "$BASE:pyproject.toml" > /tmp/base-pyproject.toml
          uv run --no-project python tools/upstream.py --base /tmp/base-pyproject.toml --head pyproject.toml --output upstream-context
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: upstream-context
          path: upstream-context/
