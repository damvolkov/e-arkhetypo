  upstream-context:
    name: what the update changed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Collect release notes and version facts for the updated dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          git show "$BASE:pyproject.toml" > /tmp/base-pyproject.toml
          uv run --no-project python .github/tools/upstream.py --base /tmp/base-pyproject.toml --head pyproject.toml --output upstream-context
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: upstream-context
          path: upstream-context/
