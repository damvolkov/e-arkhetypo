  attest:
    name: Attest build provenance
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475b771e639983404de0af8d2d90a855637  # v4.2.2
        with:
          subject-path: dist/*
