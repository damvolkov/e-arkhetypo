  bump:
    name: Version + tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.tag }}
        run: |
          if [ -n "$GIVEN" ]; then echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            IFS=. read -r M m p <<< "$(git describe --tags --abbrev=0 | sed 's/^v//')"
            case "$BUMP" in
              major) M=$((M+1)); m=0; p=0 ;;
              minor) m=$((m+1)); p=0 ;;
              *) p=$((p+1)) ;;
            esac
          else
            M=0; m=1; p=0
          fi
          echo "tag=v$M.$m.$p" >> "$GITHUB_OUTPUT"
      - name: Push tag and open the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$GH_TOKEN" | base64 -w0)" push origin "$TAG"
          gh release create "$TAG" --latest --verify-tag --generate-notes || gh release edit "$TAG" --latest=true
