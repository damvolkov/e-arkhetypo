  image:
    name: Container image → ghcr
    needs: bump
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991e38e31fa1556316c9a45dbf86b2b346d  # v4.4.1
      - uses: docker/login-action@dbcb81380d4f07eb25cbe814f20e043c6a77fa2c  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc80280459580a9a1a9f2f35b687fc1de3962feb  # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/{{brand}}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263f895c5ce87a07f344583362abcd1b463  # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
