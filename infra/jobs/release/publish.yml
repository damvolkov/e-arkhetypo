  publish:
    name: publish
    if: vars.PUBLISH_PYPI == 'true'
    needs: [bump, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/{{pypi_project}}/${{ needs.bump.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
