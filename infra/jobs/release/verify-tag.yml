  verify-tag:
    name: Verify the tag matches the package version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pyproject version to ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])' 2>/dev/null \
            || grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package version v$VERSION"
            exit 1
          fi
