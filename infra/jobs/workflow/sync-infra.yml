name: sync-infra

# On Renovate branches that bumped action pins in infra/ (the regex manager): re-assemble every
# system's .github/ and the repo's own from the sources, gate the result, record it, push with the
# App token. The pins live once, in infra/; the assemblies follow. Generated from infra/, do not edit.
# Needs the e-taxis assembler on the runner: not installed in e-arkhetypo until e-taxis exposes `infra`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sync-infra-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: re-assemble the workflows
    if: >
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Re-assemble every CI reference
        run: |
          uv run --project management python -m e_management infra
          uv run --project management python -m e_management repo-infra
      - name: Gate the result
        run: |
          uv run --project management python -m e_management infra-check
          uv run --project management python -m e_management repo-infra-check
      - name: Commit and push when the assemblies moved
        id: commit
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git diff --quiet -- .github 'projects/python/*/.github' && { echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          uv run --no-project python .github/tools/changelog.py --area infra --line "workflow pins refreshed after \`$BRANCH\`"
          git config user.name "$SLUG[bot]"
          git config user.email "$SLUG[bot]@users.noreply.github.com"
          git commit -am "chore(sync-infra): re-assemble the workflows from infra/"
          git push "https://x-access-token:$TOKEN@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
