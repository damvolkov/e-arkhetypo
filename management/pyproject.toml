##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-management"
dynamic = ["version"]
description = "e-templates internal tool: inspect, materialize and generate boilerplates from systems/ (Textual UI over a deterministic engine)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.21",
    "e-serde>=0.6.1",
    "structlog>=26.1",
    "textual>=8.2.8",
    "pytest-asyncio>=1.4.0",
    "libcst>=1.9",
    "e-core",
]

[tool.uv.sources]
e-core = { path = "../systems/core", editable = true }

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
exclude-newer-package = { "e-serde" = "2100-01-01T00:00:00Z", "anytomd" = "2100-01-01T00:00:00Z", "liteparse" = "2100-01-01T00:00:00Z", "openai" = "2100-01-01T00:00:00Z" }

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_management", "src/ops", "src/e_tui"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT", "PLR0917"]
### __main__ is the renderer of the CLI: printing is its purpose.
"src/e_management/__main__.py" = ["T20"]
### msgspec resolves Struct annotations at runtime — type-checking imports would break the schemas.
"src/e_management/core/plan.py" = ["TC001", "TC002", "TC003"]
"src/e_management/adapters/draft.py" = ["TC001"]
"src/e_management/adapters/infra.py" = ["TC001", "TC003"]
"src/e_management/core/infra.py" = ["TC001", "TC003"]
"src/e_management/ops/stack.py" = ["S104"]
### NON_SERVICE is an exclusion vocabulary for host tokens, not a socket bind.
"src/ops/compose.py" = ["S104"]

[tool.ruff.lint.isort]
known-first-party = ["e_management", "ops", "e_tui"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: slow tests (deselect with -m 'not slow')"]

##### COVERAGE #####
[tool.coverage.run]
source_pkgs = ["e_management"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
