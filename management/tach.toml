##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "data"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
layers = ["entry", "adapters", "core", "ops", "models"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_management"
layer = "entry"
depends_on = ["e_management.cli", "e_management.ui"]

[[modules]]
path = "e_management.cli"
layer = "entry"
depends_on = []

[[modules]]
path = "e_management.ui"
layer = "entry"
depends_on = ["e_management.cli"]

[[modules]]
path = "e_management.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_management.core"
layer = "core"
depends_on = []

[[modules]]
path = "e_management.ops"
layer = "ops"
depends_on = []

[[modules]]
path = "ops"
layer = "ops"
depends_on = []

[[modules]]
path = "e_management.models"
layer = "models"
depends_on = []
