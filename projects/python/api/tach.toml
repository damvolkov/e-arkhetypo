##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails. engines, processors, drivers and adapters
# share one layer: none of them imports another (the layer is horizontal), each reaches only ports, infra and ops.
layers = ["api", "execution", "ports", "infra", "ops", "models"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_api"
layer = "api"
depends_on = ["e_api.api", "e_api.websockets"]

[[modules]]
path = "e_api.api"
layer = "api"
depends_on = []

[[modules]]
path = "e_api.websockets"
layer = "api"
depends_on = ["e_api.api"]

[[modules]]
path = "engines"
layer = "execution"
depends_on = []

[[modules]]
path = "processors"
layer = "execution"
depends_on = []

[[modules]]
path = "providers.drivers"
layer = "execution"
depends_on = []

[[modules]]
path = "providers.adapters"
layer = "execution"
depends_on = []

[[modules]]
path = "ports"
layer = "ports"
depends_on = []

[[modules]]
path = "infra"
layer = "infra"
depends_on = []

[[modules]]
path = "ops"
layer = "ops"
depends_on = []

[[modules]]
path = "e_api.models"
layer = "models"
depends_on = []
