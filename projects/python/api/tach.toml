##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
### the table below is the import table of the taxonomy, spelled edge by edge: an import that is not an edge fails. `exact`
### stays off because the table declares what a layer MAY import (every execution module may reach `ops`, none does yet);
### the graph itself — no edge between engines, processors, drivers and adapters, none upward — is what the gate holds.
exact = false
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

##### SERVICE #####
### the service stands on the materialized sections and on its own models; nothing materialized imports it back.
[[modules]]
path = "e_api"
depends_on = ["e_api.api", "e_api.api.lifespan", "e_api.mcp", "e_api.websockets", "e_api.infra", "e_api.infra.auth", "e_api.infra.mcp"]

[[modules]]
path = "e_api.api"
depends_on = [
    "e_api.models",
    "e_api.engines",
    "e_api.providers.drivers",
    "e_api.providers.adapters",
    "e_api.ports",
    "e_api.infra",
    "e_api.infra.auth",
    "e_api.infra.errors",
    "e_api.ops",
]

### the composition root's lifespans stand on every section and on the MCP door they build the server of; the door reads
### the graph's typed state back from `e_api.api`, which is why the lifespans are a module of their own.
[[modules]]
path = "e_api.api.lifespan"
depends_on = [
    "e_api.api",
    "e_api.mcp",
    "e_api.engines",
    "e_api.providers.drivers",
    "e_api.ports",
    "e_api.infra",
    "e_api.infra.auth",
    "e_api.infra.mcp",
    "e_api.infra.errors",
    "e_api.ops",
]

[[modules]]
path = "e_api.mcp"
depends_on = ["e_api.api", "e_api.models", "e_api.engines", "e_api.ports", "e_api.infra", "e_api.infra.auth", "e_api.infra.mcp", "e_api.infra.errors"]

[[modules]]
path = "e_api.websockets"
depends_on = ["e_api.api", "e_api.models", "e_api.infra", "e_api.infra.errors"]

[[modules]]
path = "e_api.models"
depends_on = ["e_api.infra", "e_api.infra.errors"]

##### MATERIALIZED #####
### engines, processors, drivers and adapters are the execution level: each stands on ports, infra and ops, and none
### lists another — the horizontal ban is the absence of an edge.
[[modules]]
path = "e_api.engines"
depends_on = ["e_api.ports", "e_api.infra", "e_api.infra.auth", "e_api.infra.errors", "e_api.ops"]

[[modules]]
path = "e_api.processors"
depends_on = ["e_api.ports", "e_api.infra", "e_api.infra.errors", "e_api.ops"]

[[modules]]
path = "e_api.providers.drivers"
depends_on = ["e_api.ports", "e_api.infra", "e_api.infra.auth", "e_api.infra.errors", "e_api.ops"]

[[modules]]
path = "e_api.providers.adapters"
depends_on = ["e_api.ports", "e_api.infra", "e_api.infra.errors", "e_api.ops"]

### ports are the bottleneck of the import graph: they see infra and nothing else.
[[modules]]
path = "e_api.ports"
depends_on = ["e_api.infra", "e_api.infra.auth", "e_api.infra.errors"]

[[modules]]
path = "e_api.infra"
depends_on = ["e_api.ops", "e_api.infra.errors"]

### the opt-in infra packages look only down: nothing in `infra` proper imports them, and the MCP engine rides the auth package.
[[modules]]
path = "e_api.infra.auth"
depends_on = ["e_api.infra", "e_api.infra.errors"]

[[modules]]
path = "e_api.infra.mcp"
depends_on = ["e_api.infra", "e_api.infra.auth", "e_api.infra.errors"]

### the error tree is the floor of the package: every module, `ops` included, raises from it and it imports nothing.
[[modules]]
path = "e_api.infra.errors"
depends_on = []

[[modules]]
path = "e_api.ops"
depends_on = ["e_api.infra.errors"]
