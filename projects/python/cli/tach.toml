##### ROOTS #####
source_roots = ["src"]
exclude = ["tests"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
# `cli`: the root and the commands it mounts · `runtime`: the run's lifecycle and the port→provider binding
# (the composition root) · `services`: the use cases, which see ports only · `execution`: engines, processors,
# drivers and adapters share one horizontal layer, none imports another · then ports, the shared core, and data ·
# `errors`: the floor — the one root of every error, importing nothing (same edge as the common blueprint).
layers = ["cli", "runtime", "services", "execution", "ports", "infra", "ops", "models", "errors"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_cli.cli"
layer = "cli"
depends_on = []

[[modules]]
path = "e_cli.commands"
layer = "cli"
depends_on = []

[[modules]]
path = "e_cli.runtime"
layer = "runtime"
depends_on = []

[[modules]]
path = "e_cli.services"
layer = "services"
depends_on = []

[[modules]]
path = "engines"
layer = "execution"
depends_on = []

[[modules]]
path = "processors"
layer = "execution"
depends_on = []

[[modules]]
path = "providers.drivers"
layer = "execution"
depends_on = []

[[modules]]
path = "providers.adapters"
layer = "execution"
depends_on = []

[[modules]]
