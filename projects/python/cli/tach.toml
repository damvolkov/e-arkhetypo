##### ROOTS #####
source_roots = ["src"]
exclude = ["tests"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
# `cli`: the root and the commands it mounts · `runtime`: the run's lifecycle and the port→provider binding
# (the composition root) · `logic`: the business stores, which see ports only, seen through `logic/stores/ports` · `execution`: engines, processors,
# drivers and adapters share one horizontal layer, none imports another · then ports, the shared core, and data ·
# `errors`: the floor — the one root of every error, importing nothing (same edge as the common blueprint).
layers = ["cli", "runtime", "logic", "execution", "e_cli.ports", "e_cli.infra", "e_cli.ops", "models", "errors"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_cli.cli"
layer = "cli"
depends_on = []

[[modules]]
path = "e_cli.commands"
layer = "cli"
depends_on = []

[[modules]]
path = "e_cli.runtime"
layer = "runtime"
depends_on = []

[[modules]]
path = "e_cli.logic"
layer = "logic"
depends_on = []

[[modules]]
path = "e_cli.logic.stores.ports"
layer = "e_cli.ports"
depends_on = []

[[modules]]
path = "e_cli.engines"
layer = "execution"
depends_on = []

[[modules]]
path = "e_cli.processors"
layer = "execution"
depends_on = []

[[modules]]
path = "e_cli.providers.drivers"
layer = "execution"
depends_on = []

[[modules]]
path = "e_cli.providers.adapters"
layer = "execution"
depends_on = []

[[modules]]
path = "e_cli.ports"
layer = "e_cli.ports"
depends_on = []


[[modules]]
path = "e_cli.infra"
layer = "e_cli.infra"
depends_on = []

[[modules]]
path = "e_cli.ops"
layer = "e_cli.ops"
depends_on = []

[[modules]]
