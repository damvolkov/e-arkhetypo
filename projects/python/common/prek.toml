##### HOOKS #####
[[repos]]
repo = "local"
hooks = [
    { id = "ruff", name = "ruff check + format", entry = "uv run ruff check --fix --exit-non-zero-on-fix", language = "system", types_or = ["python", "pyi"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types_or = ["python", "pyi"] },
    { id = "ty", name = "ty type check", entry = "uv run ty check", language = "system", types = ["python"], pass_filenames = false },
    { id = "tach", name = "tach architecture check", entry = "uv run tach check", language = "system", pass_filenames = false },
    { id = "changelog", name = "CHANGELOG.md is written by the fold", entry = "sh -c 'git diff --cached --quiet -- CHANGELOG.md || [ \"$CHANGELOG_FOLD\" = 1 ] || { echo \"CHANGELOG.md is written only by the fold PR and by a release. Record your change in .changelog.d/<branch, / as ->.md; see .changelog.d/README.md.\" >&2; exit 1; }'", language = "system", always_run = true, pass_filenames = false },
    { id = "frozen-templates", name = "e-arkhetypo changes only common: the templates are frozen", entry = "sh -c 'top=$(git rev-parse --show-toplevel); [ -d \"$top/projects/python/common\" ] || exit 0; [ \"$TEMPLATES_THAW\" = 1 ] && exit 0; frozen=$(git diff --cached --name-only -- \":(top)projects\" | grep -v \"^projects/python/common/\"); [ -z \"$frozen\" ] || { echo \"e-arkhetypo: only projects/python/common changes; the templates are frozen (TEMPLATES_THAW=1 to deprecate one):\" >&2; echo \"$frozen\" >&2; exit 1; }'", language = "system", always_run = true, pass_filenames = false },
    { id = "no-init", name = "no __init__.py: the tree is a namespace package (e-nous law 1)", entry = "__init__.py is never created", language = "fail", files = "(^|/)__init__\\.py$" },
    { id = "gates", name = "the house laws no tool names (gates/rules.yml, e-nous law 21)", entry = "uv run python -m gates.engine check", language = "system", stages = ["manual"] },
    { id = "zizmor", name = "workflow hardening scan", entry = "uv run zizmor --persona=regular .github/workflows", language = "system", files = "^\\.github/workflows/.*\\.ya?ml$", pass_filenames = false },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks" },
]
