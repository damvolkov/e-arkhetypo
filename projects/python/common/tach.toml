##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs", "common"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails. engines, processors, drivers and adapters
# share one layer: none of them imports another (the layer is horizontal), each reaches only ports, infra and ops.
layers = ["execution", "ports", "infra", "ops", "base"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_infra.engines"
layer = "execution"
depends_on = []

[[modules]]
path = "e_infra.processors"
layer = "execution"
depends_on = []

[[modules]]
path = "e_infra.providers.drivers"
layer = "execution"
depends_on = []

[[modules]]
path = "e_infra.providers.adapters"
layer = "execution"
depends_on = []

[[modules]]
path = "e_infra.ports"
layer = "ports"
depends_on = []

[[modules]]
path = "e_infra.infra"
layer = "infra"
depends_on = []

### the error tree is the floor of the package: every layer, `ops` included, raises from it and it imports nothing.
[[modules]]
path = "e_infra.infra.errors"
layer = "base"
depends_on = []

[[modules]]
path = "e_infra.ops"
layer = "ops"
depends_on = []
