services:
  api:
    image: example/api:1.0
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://db:5432/app
      - CACHE_URL=redis://cache:6379/0
      - LOG=info
    ports:
      - "127.0.0.1:8080:80"
      - "9999:9999/udp"
    networks: [stack]
    labels:
      tier: backend
      owner: platform
    depends_on: [db, cache]
