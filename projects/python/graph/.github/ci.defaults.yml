# CI reference — the features this project ships by default and the name-neutral tokens its fragments need.
# e-taxis assembles .github/workflows from infra/ with this file; edit the reference, not the output.

features: [ci-basics, docs, pypi, image, frontend]

tokens:
  os: "[ubuntu-latest, macos-latest, windows-latest]"
  python: "['3.14']"
  markers: "not slow and not ui"
  site: site
  ui_dir: src/{{package}}/ui
