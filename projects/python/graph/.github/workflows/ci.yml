name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # feature: ci-basics
  quality:
    name: lint · types · arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Static gates
        run: |
          uv sync --group lint --no-install-project
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run ty check
          uv run tach check
          uv run validate-pyproject pyproject.toml
      - name: Workflow hardening scan
        run: uv run zizmor --persona=regular .github/workflows

  # feature: ci-basics
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Sync env
        run: uv sync --python ${{ matrix.python }}
      - name: Unit tests + coverage gate
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          uv run pytest -m "not slow and not ui" --cov --cov-report=term 2>&1 | tee ci-logs/build-test.log
      - name: Keep the log for ai-fix
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-logs/

  # feature: docs
  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Strict build (fails on broken links or missing assets)
        run: |
          uv sync --group docs --no-install-project
          uv run zensical build --strict
      - name: Stage site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  # feature: docs
  pages:
    name: pages deploy
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # feature: frontend
  ui:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/e_graph/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/e_graph/ui/pnpm-lock.yaml
      - name: Install, check, build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

  # feature: frontend
  snapshots:
    name: visual snapshots
    if: vars.UI_SNAPSHOTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/e_graph/ui/pnpm-lock.yaml
      - name: Bundle the UI, install the browser, run the acceptance pass
        run: |
          pnpm -C src/e_graph/ui install --frozen-lockfile
          pnpm -C src/e_graph/ui build
          uv sync
          uv run playwright install --with-deps chromium
          uv run pytest tests/acceptance -m ui -q

