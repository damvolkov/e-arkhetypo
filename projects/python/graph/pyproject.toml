##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-graph"
dynamic = ["version"]
description = "e-stack graph template: LangGraph runtime, rustworkx topology, React Flow canvas over Litestar + Granian, shared infra materialized from projects/python/common"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack", "langgraph", "rustworkx", "react-flow"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### core #####
    "litestar>=2.24",
    "granian[reload]>=2.7",
    "asgi-correlation-id>=5.0.1",
    "structlog>=26.1",
    ##### data #####
    "msgspec>=0.21",
    "e-serde>=0.6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    ##### crypto #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "anyio>=4.15.1",
    ##### http #####
    "wreq>=0.10",
    ##### graph #####
    "langgraph>=1.2.12",
    "rustworkx>=0.18.1",
    ##### agent — any-llm: one transport over every provider; a provider beyond openai/anthropic needs its extra #####
    "any-llm-sdk>=1.30",
    ### raw JSON Schema replies validated in Rust: measured 2026-10-13 at 1.2 µs vs fastjsonschema 10.1 µs, jsonschema 147 µs.
    "jsonschema-rs>=0.58",
    ##### documents — liteparse (Rust, in-process) first, docling-serve for what it reads better; polars frames #####
    "liteparse>=2.14",
    "anytomd[full]>=1.3.1.post2,<1.4",
    "tree-sitter-language-pack>=1.22",
    "lingua-language-detector>=2.2",
    "watchfiles>=1.3.0",
    "polars>=2.0",
    ##### telemetry #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ##### stores #####
    "redis>=6.2",
    "aiosqlite>=0.22.1",
    ##### background — the in-process supervisor and the dispatch engine schedule cron jobs #####
    "croniter>=6.0",
    ### the db lifespan provisions the databases the settings name: CREATE DATABASE, outside any transaction.
    "psqlpy>=0.12",
    "beartype>=0.22.9",
    "cyclopts>=4.25.3",
    "wasi-graphviz[wasmtime]>=0.1.4",
    "rstr>=3.2.2",
]

[project.scripts]
e-graph = "e_graph.cli:main"

[project.urls]
Homepage = "https://github.com/damvolkov/e-arkhetypo"
Source = "https://github.com/damvolkov/e-arkhetypo"
Issues = "https://github.com/damvolkov/e-arkhetypo/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-stress>=1.0.1",
    "fakeredis>=2.38.0",
    "pytest-httpserver>=1.2.0",
    "pytest-resources[serde,objects]>=0.3.2",
    ##### agent tests: mocks for unit, recorded cassettes (vcrpy) for integration #####
    "pytest-mock>=3.16",
    "pytest-recording>=0.14",
    ##### ui snapshots: the official browser driver + the house snapshot engine (PNG extension) #####
    "pytest-playwright-asyncio>=0.9",
    "syrupy>=6.1",
    "pillow>=12",
]
docs = [
    "mkdocstrings[python]>=1.0.7",
    "zensical>=0.0.70",
]
dev = [
    "ast-grep-cli>=0.40",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "prek>=0.4",
    ### structural rewrite of projects/python/common at materialization time (scripts/materialize.py); parses real 3.14 syntax.
    "libcst>=1.9",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
### pytest-resources and e-serde are first-party and can publish same-day; exempt them from the freshness guard.
exclude-newer-package = { "pytest-resources" = "2100-01-01T00:00:00Z", "e-serde" = "2100-01-01T00:00:00Z", "anytomd" = "2100-01-01T00:00:00Z", "liteparse" = "2100-01-01T00:00:00Z", "openai" = "2100-01-01T00:00:00Z" }
### pytest-resources 0.3.2 caps its serde extra at e-serde<0.6 (precautionary 0.x semver); the app needs 0.6.
### e-serde 0.6 verified against pytest-resources' loaders at runtime (tests/unit/test_resources.py) — override the cap.
override-dependencies = ["e-serde>=0.6.1"]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_graph"]
### the canvas is part of the package: its built bundle ships (gitignored, so declared), its sources never do.
artifacts = ["src/e_graph/ui/dist/**"]
exclude = ["src/e_graph/ui/*", "!src/e_graph/ui/dist"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
### the gates engine runs ast-grep: the binary resolved by path, the arguments ours.
"gates/engine.py" = ["S603"]
"tests/**" = ["S101", "S106", "S311", "PLR2004", "ARG", "FBT"]
### TID251 stays on over tests/ — it bans the pytest ghosts; only these files read the environment on purpose.
"tests/conftest.py" = ["TID251"]
"tests/acceptance/e_graph/conftest.py" = ["TID251"]
"tests/integration/e_graph/conftest.py" = ["TID251"]
"tests/unit/e_graph/conftest.py" = ["TID251"]
### the node contract resolves test nodes' annotations at runtime: their RunState import must be real.
"tests/unit/e_graph/instrument/test_node.py" = ["S101", "PLR2004", "ARG", "TC001"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### litestar and msgspec resolve annotations at runtime — type-checking imports would break them.
"src/e_graph/api/**" = ["TC001", "TC002", "TC003"]
"src/e_graph/models/**" = ["TC001", "TC002", "TC003"]
"src/e_graph/main.py" = ["TC001", "TC002", "TC003"]
"src/e_graph/cli.py" = ["TC001", "TC002", "TC003", "FBT"]
"src/e_graph/instrument/**" = ["TC001", "TC002", "TC003"]
"src/e_graph/pipelines/*/nodes/**" = ["TC001", "TC002", "TC003"]
### a runner's signature is its role's contract, read as source: `state` and `call` are taken, used or not.
"src/e_graph/runners/**" = ["TC001", "TC002", "TC003", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "config is an injected contract: pydantic-settings, never os.environ (e-nous law 16)"
"os.getenv".msg = "config is an injected contract: pydantic-settings, never os.getenv (e-nous law 16)"
"pytest.mark.xfail".msg = "a red is never hidden: fix the code or the expectation (e-nous test-py-tdd rule 2)"
"pytest.xfail".msg = "a red is never hidden: fix the code or the expectation (e-nous test-py-tdd rule 2)"
"pytest.mark.skip".msg = "a red is never hidden: a test that cannot run errors (e-nous test-py-tdd rule 2)"
"pytest.mark.skipif".msg = "a red is never hidden: a test that cannot run errors (e-nous test-py-tdd rule 2)"
"pytest.skip".msg = "a red is never hidden: a test that cannot run errors (e-nous test-py-tdd rule 2)"
"pytest.importorskip".msg = "a red is never hidden: a missing dependency is an error (e-nous test-py-tdd rule 2)"
"unittest.skip".msg = "a red is never hidden: a test that cannot run errors (e-nous test-py-tdd rule 2)"

[tool.ruff.lint.isort]
known-first-party = ["e_graph", "gates"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "e_graph.infra.config.base.BaseSettings",
    "msgspec.Struct",
    "e_graph.infra.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "gates"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
### `tests/support` holds the test helpers (the spec crafter), importable by name: `from support.crafter import ...`.
pythonpath = ["tests"]
strict = true
filterwarnings = [
    "error",
    ### joserfc warns on every EdDSA JWT per RFC 9864 (non-committing signature); kept as an offered alg.
    "ignore::joserfc.errors.SecurityWarning",
    ### any-llm warns, while raising, that its exceptions will be unified: as an error it would mask the real one.
    "ignore:Provider-specific exceptions will be converted:DeprecationWarning",
]
timeout = "60"
### an empty parametrize is a vacuous test, never a silent skip.
empty_parameter_set_mark = "fail_at_collect"
asyncio_mode = "auto"
### one loop per session (per xdist worker): Playwright's async browser lives for the session, and a fixture
### on one loop can never be awaited from another — every async test and fixture shares that single loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "stress: concurrent-load tests, soaken for a duration with `make stress` (pytest-stress)",
    "integration: the agent against a real model, replayed from recorded cassettes — out of the default run: `make integration` replays them, `make record` re-records them against the live model",
    "ui: browser snapshots of the canvas — chromium + the built bundle (`make bundle`); `make snap` accepts them",
]

##### COVERAGE #####
[tool.coverage.run]
### engines/, infra/, ops/, ports/, processors/ and providers/ are materialized into e_graph and tested at their source (projects/python/common); the gate covers the service.
source_pkgs = ["e_graph"]
omit = [
    "*/src/e_graph/engines/*",
    "*/src/e_graph/infra/*",
    "*/src/e_graph/ops/*",
    "*/src/e_graph/ports/*",
    "*/src/e_graph/processors/*",
    "*/src/e_graph/providers/*",
    ### runners a test writes to its tmp dir load under `e_graph.runners.*`: fixtures, never the product.
    "*/pytest-of-*/*",
]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
