kind: semantic
name: EXT-income
description: The income statement's headline figures for the fiscal year the 10-K reports, in US dollars.
pre: agnostic/document/pages
post: agnostic/number/scale
check: agnostic/context/present
args:
  pre:
    titles: [consolidated statements of operations, consolidated statements of income]
    words: [net income, gross, operating income, earnings per share]
    most: 3
  post:
    fields: [revenue, cost_of_revenue, gross_profit, operating_income, net_income]
  check:
    needs: [ingest/ING-document]
instructions: >-
  From the consolidated statement of operations (or of income), the most recent fiscal year's column:
  total revenue (net sales or net operating revenues), cost of revenue (cost of sales or of goods sold),
  gross profit (gross margin), operating income, and net income attributable to the company's
  shareholders (after noncontrolling interests, when the statement shows them), each in millions of US
  dollars exactly as printed; basic and diluted earnings per share in US dollars.
wiki: [statement-units]
output:
  type: object
  properties:
    revenue: {type: number}
    cost_of_revenue: {type: number}
    gross_profit: {type: number}
    operating_income: {type: number}
    net_income: {type: number}
    eps_basic: {type: number}
    eps_diluted: {type: number}
  required: [revenue, cost_of_revenue, gross_profit, operating_income, net_income, eps_basic, eps_diluted]
  additionalProperties: false
