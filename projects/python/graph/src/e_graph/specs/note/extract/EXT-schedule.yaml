kind: deterministic
name: EXT-schedule
description: The observation schedule as ISO dates — the table's printed dates, normalized, with the note's calendar.
runner: owned/schedule
check: agnostic/context/present
args:
  check:
    needs: [extract/EXT-dates, extract/EXT-schedule-table]
depends: [EXT-dates, EXT-schedule-table]
output:
  type: object
  properties:
    count: {type: integer, minimum: 1}
    observations:
      type: array
      minItems: 1
      items:
        type: object
        properties:
          observation_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
          payment_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
        required: [observation_date, payment_date]
        additionalProperties: false
    first_observation: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
    final_observation: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
    maturity_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
  required: [count, observations, first_observation, final_observation, maturity_date]
  additionalProperties: false
