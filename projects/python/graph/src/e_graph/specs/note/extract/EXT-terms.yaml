kind: deterministic
name: EXT-terms
description: The whole term sheet in one record — identifiers, money, calendar, protective levels and parties, normalized.
runner: owned/terms
check: agnostic/context/present
args:
  check:
    needs:
      - extract/EXT-identifiers
      - extract/EXT-amounts
      - extract/EXT-registration
      - extract/EXT-fees
      - extract/EXT-dates
      - extract/EXT-underlier
      - extract/EXT-coupon
      - extract/EXT-barrier
      - extract/EXT-autocall
      - extract/EXT-estimated-value
      - extract/EXT-agents
      - extract/EXT-listing
      - extract/EXT-schedule
depends:
  - EXT-identifiers
  - EXT-amounts
  - EXT-registration
  - EXT-fees
  - EXT-dates
  - EXT-underlier
  - EXT-coupon
  - EXT-barrier
  - EXT-autocall
  - EXT-estimated-value
  - EXT-agents
  - EXT-listing
  - EXT-schedule
bound: cpu
output:
  type: object
  properties:
    cusip: {type: string}
    isin: {type: string}
    registration_no: {type: string}
    currency_symbol: {type: string, pattern: "^\\$"}
    aggregate_principal: {type: number, exclusiveMinimum: 0}
    denomination: {type: number, exclusiveMinimum: 0}
    offering_price: {type: number, exclusiveMinimum: 0}
    underwriting_discount: {type: number, minimum: 0}
    pricing_date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
    issue_date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
    maturity_date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
    final_observation_date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
    underlier:
      type: object
      properties:
        name: {type: string}
        ticker: {type: string}
        is_index: {type: boolean}
      required: [name, ticker, is_index]
      additionalProperties: false
    coupon:
      type: object
      properties:
        rate_percent: {type: number, exclusiveMinimum: 0}
        quarterly_payment: {type: number, exclusiveMinimum: 0}
        frequency: {type: string}
      required: [rate_percent, quarterly_payment, frequency]
      additionalProperties: false
    levels:
      type: object
      properties:
        initial_value: {type: number, exclusiveMinimum: 0}
        coupon_barrier: {type: number, exclusiveMinimum: 0}
        downside_threshold: {type: number, exclusiveMinimum: 0}
        call_level: {type: number, exclusiveMinimum: 0}
        share_of_initial_percent: {type: number, exclusiveMinimum: 0}
      required: [initial_value, coupon_barrier, downside_threshold, call_level, share_of_initial_percent]
      additionalProperties: false
    estimated_value: {type: number, exclusiveMinimum: 0}
    calculation_agent: {type: string}
    selling_agents: {type: array, minItems: 1, items: {type: string}}
    listed: {type: boolean}
    observations: {type: integer, minimum: 1}
  required:
    - cusip
    - isin
    - registration_no
    - currency_symbol
    - aggregate_principal
    - denomination
    - offering_price
    - underwriting_discount
    - pricing_date
    - issue_date
    - maturity_date
    - final_observation_date
    - underlier
    - coupon
    - levels
    - estimated_value
    - calculation_agent
    - selling_agents
    - listed
    - observations
  additionalProperties: false
