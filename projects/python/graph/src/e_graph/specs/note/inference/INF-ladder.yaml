kind: deterministic
name: INF-ladder
description: Every date the note can be called and what is paid on each — the autocall ladder.
runner: owned/ladder
check: agnostic/context/present
args:
  check:
    needs: [extract/EXT-terms, extract/EXT-schedule]
output:
  type: object
  properties:
    ladder:
      type: array
      minItems: 1
      items:
        type: object
        properties:
          date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
          payout: {type: number, exclusiveMinimum: 0}
        required: [date, payout]
        additionalProperties: false
  required: [ladder]
  additionalProperties: false
