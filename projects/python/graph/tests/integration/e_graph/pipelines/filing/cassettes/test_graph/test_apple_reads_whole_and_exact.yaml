      the company's shareholders (after noncontrolling interests, when the statement
      shows them), each in millions of US dollars exactly as printed; basic and diluted
      earnings per share in US dollars.\\nGlossary, statement-units:\\n# statement-units\\n\\nFinancial
      statements print most figures in millions of US dollars (\\\"In millions, except
      per-share\\namounts\\\"): read them as printed, without adding zeros. Per-share
      amounts are in dollars. A figure in\\nparentheses is negative.\"},{\"role\":\"user\",\"content\":\"###
