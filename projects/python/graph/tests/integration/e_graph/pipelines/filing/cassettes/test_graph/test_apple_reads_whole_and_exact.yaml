    body: "{\"model\":\"gemma4-26b-a4b\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-balance\\nThe
      balance sheet's headline figures at the end of the fiscal year the 10-K reports,
      in US dollars.\\nFrom the consolidated balance sheet, the most recent year-end
      column: total assets, total liabilities, total shareholders' (stockholders')
      equity attributable to the company, and cash and cash equivalents, each in millions
      of US dollars exactly as printed.\\nGlossary, statement-units:\\n# statement-units\\n\\nFinancial
      statements print most figures in millions of US dollars (\\\"In millions, except
      per-share\\namounts\\\"): read them as printed, without adding zeros. Per-share
      amounts are in dollars. A figure in\\nparentheses is negative.\\n\\n### EXT-cover\\nWho
      filed the 10-K, for which fiscal year, and how many shares were outstanding.\\nFrom
      the cover page of this Form 10-K: the registrant's exact name as printed; the
      last day of the fiscal year the report covers, as an ISO date (YYYY-MM-DD);
      and the number of shares of common stock outstanding at the latest date the
      cover states, as a whole number.\\nGlossary, ten-k:\\n# ten-k\\n\\nForm 10-K:
      the annual report a US public company files with the SEC. Its cover page names
      the\\nregistrant, the fiscal year it covers (\\\"For the fiscal year ended ...\\\")
      and the shares of common stock\\noutstanding at a date shortly before filing.\\n\\n###
      EXT-income\\nThe income statement's headline figures for the fiscal year the
      10-K reports, in US dollars.\\nFrom the consolidated statement of operations
      (or of income), the most recent fiscal year's column: total revenue (net sales
      or net operating revenues), cost of revenue (cost of sales or of goods sold),
