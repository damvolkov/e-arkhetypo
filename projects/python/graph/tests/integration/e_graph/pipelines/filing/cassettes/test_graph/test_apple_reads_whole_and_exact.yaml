      and contingencies |  |  |\\n|  |  |  |\\n| Shareholders' equity: |  |  |\\n|
      Common stock and additional paid-in capital, $0.00001 par value: 50,400,000
      shares authorized; 14,773,260 and 15,116,786 shares issued and outstanding,
      respectively | 93,568 | 83,276 |\\n| Accumulated deficit | (14,264) | (19,154)
      |\\n| Accumulated other comprehensive loss | (5,571) | (7,172) |\\n| Total shareholders'
      equity | 73,733 | 56,950 |\\n| Total liabilities and shareholders' equity |
      $ 359,241 | $ 364,980 |\\n\\nSee accompanying Notes to Consolidated Financial
      Statements.\\n\\n## Page 53\\n### Derivative Instruments\\n\\nThe Company presents
      derivative assets and liabilities at their gross fair values in the Consolidated
      Balance Sheets.\\n\\n### Income Taxes\\n\\nThe Company records certain deferred
      tax assets and liabilities in connection with the minimum tax on certain foreign
      earnings created by the TCJA.\\n\\n### Leases\\n\\nThe Company combines and
      accounts for lease and nonlease components as a single lease component for leases
      of corporate and retail facilities.\\n\\n### Note 2 - Revenue\\n\\nThe Company
      recognizes revenue at the amount to which it expects to be entitled when control
      of products or services is transferred to its customers. Control is generally
      transferred when the Company has a present right to payment and title and the
      significant risks and rewards of ownership of products or services are transferred
      to its customers. For most of the Company's Products net sales, control transfers
      when products are shipped. For the Company's Services net sales, control transfers
      over time as services are delivered. Payment for Products and Services net sales
      is collected within a short period following transfer of control or commencement
      of delivery of services, as applicable. The Company records reductions to Products
      net sales related to future product returns, price protection and other customer
      incentive programs based on the Company's expectations and historical experience.
      For arrangements with multiple performance obligations, which represent promises
      within an arrangement that are distinct, the Company allocates revenue to all
      distinct performance obligations based on their relative stand-alone selling
      prices (\\\"SSPs\\\"). When available, the Company uses observable prices to
      determine SSPs. When observable prices are not available, SSPs are established
      that reflect the Company's best estimates of what the selling prices of the
      performance obligations would be if they were sold regularly on a stand-alone
      basis. The Company's process for estimating SSPs without observable prices considers
      multiple factors that may vary depending upon the unique facts and circumstances
      related to each performance obligation including, where applicable, prices charged
      by the Company for similar offerings, market trends in the pricing for similar
      offerings, product-specific business objectives and the estimated cost to provide
      the performance obligation. The Company has identified the performance obligations
      regularly included in arrangements involving the sale of iPhone, Mac and iPad.
      The first material performance obligation, which represents the substantial
      portion of the allocated sales price, is the hardware and bundled software delivered
      at the time of sale. The second material performance obligation is the right
      to receive certain product-related bundled services, which include iCloud ,
      Siri and Maps. The Company allocates revenue and any related discounts\xAE \xAE
      to all of its performance obligations based on their relative SSPs. Because
      the Company lacks observable prices for product-related bundled services, the
      allocation of revenue is based on the Company's estimated SSPs. Revenue allocated
      to the delivered hardware and bundled software is recognized when control has
      transferred to the customer, which generally occurs when the product is shipped.
      Revenue allocated to product-related bundled services is deferred and recognized
      on a straight-line basis over the estimated period they are expected to be provided.
      For certain long-term service arrangements, the Company has performance obligations
      for services it has not yet delivered. For these arrangements, the Company does
      not have a right to bill for the undelivered services. The Company has determined
      that any unbilled consideration relates entirely to the value of the undelivered
      services. Accordingly, the Company has not recognized revenue, and does not
      disclose amounts, related to these undelivered services. For the sale of third-party
      products where the Company obtains control of the product before transferring
      it to the customer, the Company recognizes revenue based on the gross amount
      billed to customers. The Company considers multiple factors when determining
      whether it obtains control of third-party products, including evaluating if
      it can establish the price of the product, retains inventory risk for tangible
      products or has the responsibility for ensuring acceptability of the product.
      For third-party applications sold through the App Store, the Company does not
      obtain control of the product before transferring it to the customer. Therefore,
      the Company accounts for all third-party application-related sales on a net
      basis by recognizing in Services net sales only the commission it retains.\\n\\n##
      Page 72\\n### Report of Independent Registered Public Accounting Firm\\n\\nTo
      the Shareholders and the Board of Directors of Apple Inc.\\n\\n### Opinion on
      the Financial Statements\\n\\nWe have audited the accompanying consolidated
      balance sheets of Apple Inc. (the \\\"Company\\\") as of September 27, 2025
      and September 28, 2024, the related consolidated statements of operations, comprehensive
      income, shareholders' equity and cash flows for each of the three years in the
      period ended September 27, 2025, and the related notes (collectively referred
      to as the \\\"financial statements\\\"). In our opinion, the financial statements
      present fairly, in all material respects, the financial position of the Company
      at September 27, 2025 and September 28, 2024, and the results of its operations
      and its cash flows for each of the three years in the period ended September
      27, 2025, in conformity with U.S. generally accepted accounting principles (\\\"GAAP\\\").
      We also have audited, in accordance with the standards of the Public Company
      Accounting Oversight Board (United States) (\\\"PCAOB\\\"), the Company's internal
      control over financial reporting as of September 27, 2025, based on criteria
      established in *Internal Control - Integrated Framework issued by the Committee
      of Sponsoring Organizations of the Treadway Commission (2013* framework) and
      our report dated October 31, 2025 expressed an unqualified opinion thereon.\\n\\n###
      Basis for Opinion\\n\\nThese financial statements are the responsibility of
      the Company's management. Our responsibility is to express an opinion on the
      Company's financial statements based on our audits. We are a public accounting
      firm registered with the PCAOB and are required to be independent with respect
      to the Company in accordance with the U.S. federal securities laws and the applicable
      rules and regulations of the Securities and Exchange Commission and the PCAOB.
      We conducted our audits in accordance with the standards of the PCAOB. Those
      standards require that we plan and perform the audit to obtain reasonable assurance
      about whether the financial statements are free of material misstatement, whether
      due to error or fraud. Our audits included performing procedures to assess the
      risks of material misstatement of the financial statements, whether due to error
      or fraud, and performing procedures that respond to those risks. Such procedures
      included examining, on a test basis, evidence regarding the amounts and disclosures
      in the financial statements. Our audits also included evaluating the accounting
      principles used and significant estimates made by management, as well as evaluating
      the overall presentation of the financial statements. We believe that our audits
      provide a reasonable basis for our opinion.\\n\\n### Critical Audit Matter\\n\\nThe
      critical audit matter communicated below is a matter arising from the current
      period audit of the financial statements that was communicated or required to
      be communicated to the audit committee and that: (1) relates to accounts or
      disclosures that are material to the financial statements and (2) involved our
      especially challenging, subjective, or complex judgments. The communication
      of the critical audit matter does not alter in any way our opinion on the financial
      statements, taken as a whole, and we are not, by communicating the critical
      audit matter below, providing a separate opinion on the critical audit matter
      or on the account or disclosure to which it relates.\\n\\n### Uncertain Tax
      Positions\\n\\nDescription of the Matter As discussed in Note 7 to the financial
      statements, the Company is subject to income taxes in the U.S. and numerous
      foreign jurisdictions. As of September 27, 2025, the total amount of gross unrecognized
      tax benefits was $23.2 billion, of which $10.6 billion, if recognized, would
      impact the Company's effective tax rate. In accounting for some of the uncertain
      tax positions, the Company uses significant judgment in the interpretation and
      application of GAAP and complex domestic and international tax laws. Auditing
      management's evaluation of whether an uncertain tax position is more likely
