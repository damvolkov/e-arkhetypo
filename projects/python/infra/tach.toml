##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs", "common"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
layers = ["processors", "adapters", "infra", "ops"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_infra.processors"
layer = "processors"
depends_on = []

[[modules]]
path = "e_infra.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_infra.infra"
layer = "infra"
depends_on = []

[[modules]]
path = "e_infra.ops"
layer = "ops"
depends_on = []
