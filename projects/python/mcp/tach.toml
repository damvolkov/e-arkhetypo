##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs", "scripts"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails. The logic sees models only;
# the MCP edge and the config depend downward, never the reverse; main is the composition root.
layers = ["root", "edge", "logic", "models", "adapters", "infra", "ops"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_mcp"
layer = "root"
depends_on = []

[[modules]]
path = "e_mcp.mcp"
layer = "edge"
depends_on = []

[[modules]]
path = "e_mcp.config"
layer = "edge"
depends_on = []

[[modules]]
path = "e_mcp.logic"
layer = "logic"
depends_on = []

[[modules]]
path = "e_mcp.models"
layer = "models"
depends_on = []

[[modules]]
path = "adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "infra"
layer = "infra"
depends_on = []

[[modules]]
path = "ops"
layer = "ops"
depends_on = []
