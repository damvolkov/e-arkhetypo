##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-tui"
dynamic = ["version"]
description = "e-stack tui template: config-driven responsive layout mini-framework over Textual, fillable static/dynamic frames, snapshot gallery, shared infra materialized from projects/python/infra"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Environment :: Console",
]
dependencies = [
    ##### core #####
    "textual>=8.2.8",
    "structlog>=26.1",
    ##### data #####
    "msgspec>=0.21",
    "e-serde>=0.5.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    ##### crypto #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "anyio>=4.15.1",
    ##### http #####
    "wreq>=0.10",
    ##### telemetry #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ##### stores #####
    "redis>=6.2",
    "aiosqlite>=0.20",
    "beartype>=0.22.9",
    ##### documents — liteparse (Rust, in-process) first, docling-serve for what it reads better; polars frames #####
    "liteparse>=2.14",
    "anytomd[full]>=1.3.1.post2,<1.4",
    "polars>=2.0",
]

[project.scripts]
etui = "e_tui.__main__:main"

[project.urls]
Homepage = "https://github.com/damvolkov/e-arkhetypo"
Source = "https://github.com/damvolkov/e-arkhetypo"
Issues = "https://github.com/damvolkov/e-arkhetypo/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-textual-snapshot>=1.1",
    "fakeredis>=2.38.0",
    "pytest-resources[serde]>=0.3.2",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4",
    ### structural rewrite of projects/python/infra at materialization time (scripts/materialize.py); parses real 3.14 syntax.
    "libcst>=1.9",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
### pytest-resources is first-party and can publish same-day; exempt it from the freshness guard.
### e-serde is likewise first-party (the spec decoder); exempt it too.
exclude-newer-package = { "pytest-resources" = "2100-01-01T00:00:00Z", "e-serde" = "2100-01-01T00:00:00Z", "anytomd" = "2100-01-01T00:00:00Z", "liteparse" = "2100-01-01T00:00:00Z", "openai" = "2100-01-01T00:00:00Z" }
### pytest-textual-snapshot pins syrupy==4.8 (needs pytest<9); this house runs pytest>=9.1.
### syrupy 6.1 verified compatible with the plugin at runtime — override the stale pin.
override-dependencies = ["syrupy>=6.1"]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_tui", "src/infra", "src/ops", "src/adapters", "src/processors"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT", "TC001", "TC002", "TC003"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### the entrypoint prints the version to stdout: that IS its job.
"src/e_tui/__main__.py" = ["T20"]
### textual's reactive, msgspec structs and frozen dataclasses resolve annotations at runtime —
### TC00x (move into type-checking) or UP037 (strip quotes) would break decode and field types.
"src/e_tui/layout/**" = ["TC001", "TC002", "TC003", "UP037"]
"src/e_tui/flow/**" = ["TC001", "TC002", "TC003", "UP037"]
"src/e_tui/interact/**" = ["TC001", "TC002", "TC003", "UP037"]
"src/e_tui/models/**" = ["TC001", "TC002", "TC003", "UP037"]
"src/e_tui/templates/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["e_tui", "infra", "ops", "adapters"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "infra.settings.base.BaseSettings",
    "msgspec.Struct",
    "infra.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = [
    "error",
    ### pytest-textual-snapshot 1.1 still calls the deprecated utcnow() when writing SVG diffs; third-party noise, not ours.
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: slow tests (deselect with -m 'not slow')"]

##### COVERAGE #####
[tool.coverage.run]
### infra/, ops/ and adapters/ are materialized and tested at their source (projects/python/infra); the gate covers the tool.
source_pkgs = ["e_tui"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
