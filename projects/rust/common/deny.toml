##### ADVISORIES #####
[advisories]
version = 2
yanked = "deny"

##### LICENSES #####
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

##### BANS #####
[bans]
multiple-versions = "warn"
wildcards = "deny"

##### SOURCES #####
[sources]
unknown-registry = "deny"
unknown-git = "deny"
