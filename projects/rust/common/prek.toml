##### HOOKS #####
[[repos]]
repo = "local"
hooks = [
    { id = "fmt", name = "rustfmt", entry = "cargo fmt --all -- --check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "clippy", name = "clippy with the house lints", entry = "make lint", language = "system", types = ["rust"], pass_filenames = false },
    { id = "test", name = "cargo test", entry = "make test", language = "system", types_or = ["rust", "toml"], pass_filenames = false },
    { id = "deny", name = "cargo deny", entry = "cargo deny check", language = "system", files = "^(Cargo\\.(toml|lock)|deny\\.toml)$", pass_filenames = false },
    { id = "changelog", name = "CHANGELOG.md is written by the fold", entry = "sh -c 'git diff --cached --quiet -- CHANGELOG.md || [ \"$CHANGELOG_FOLD\" = 1 ] || { echo \"CHANGELOG.md is written only by a release. Record your change in .changelog.d/<branch, / as ->.md; see .changelog.d/README.md.\" >&2; exit 1; }'", language = "system", always_run = true, pass_filenames = false },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", args = ["--branch", "main"], stages = ["pre-commit"], always_run = true },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks" },
]
