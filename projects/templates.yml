##### TEMPLATES #####
templates:
  api:
    source: projects/python/api
    package: e_api
    brand: e-api
    drops: [uv.lock, scripts/materialize.py, .github/workflows, .github/ci.map.yml, .github/ci.vars.example, .github/INSTALL.md, tests/unit/test_ci_contract.py]
    common:
      root: projects/python/common
      package: e_infra
      skip: [ops/tui]
      ##### DETACH — how the system lets go of a common unit it wires; without rules a wired unit stays locked #####
      detach:
        - unit: providers/drivers/store/redis
          prunes:
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^from e_api\.providers\.drivers\.store\.redis import RedisDriver\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^    redis: StorePort\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^        redis = await enter\(RedisDriver\(\)\)\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: ', redis=redis'}
            - {file: tests/unit/e_api/api/lifespan/test_providers.py, pattern: '^    assert (isinstance\(section\.redis, StorePort\)|section\.redis\.spec\.name == "redis")\n'}
            - {file: tests/unit/e_api/api/router/test_health.py, pattern: '^from e_api\.providers\.drivers\.store\.redis import RedisDriver\n'}
            - {file: tests/conftest.py, pattern: '^import fakeredis\nimport fakeredis\.aioredis\n'}
            - {file: tests/conftest.py, pattern: '^from e_api\.providers\.drivers\.store import redis as redis_module\n'}
            - {file: tests/conftest.py, pattern: '^@pytest\.fixture\(autouse=True\)\ndef redis_server[\s\S]*?(?=^@pytest\.fixture)'}
            - {file: tests/unit/e_api/api/router/test_health.py, pattern: '\(RedisDriver, "redis", 200\), '}
            - {file: tests/unit/e_api/api/router/test_health.py, pattern: '"optional-down", '}
            - {file: tests/unit/e_api/api/router/test_health.py, pattern: ' \| RedisDriver'}
            - {file: pyproject.toml, pattern: '^    "(fake)?redis>=[^"]*",\n'}
        - unit: providers/drivers/http/wreq
          prunes:
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^from e_api\.providers\.drivers\.http\.wreq import WreqDriver\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^from e_api\.ports\.http import HTTPPort\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^    http: HTTPPort\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: '^        http = await enter\(WreqDriver\(\)\)\n'}
            - {file: src/e_api/api/lifespan/providers.py, pattern: ', http=http'}
            - {file: tests/unit/e_api/api/lifespan/test_providers.py, pattern: '^from e_api\.ports\.http import HTTPPort\n'}
            - {file: tests/unit/e_api/api/lifespan/test_providers.py, pattern: '^    assert (isinstance\(section\.http, HTTPPort\)|section\.http\.spec\.name == "wreq")\n'}
            - {file: pyproject.toml, pattern: '^    ##### http #####\n    "wreq>=[^"]*",\n'}
    materials: &materials
      - {src: projects/python/common/prek.toml, dst: prek.toml}
      - {src: projects/python/common/.gitattributes, dst: .gitattributes}
      - {src: projects/python/common/.python-version, dst: .python-version}
      - {src: projects/python/common/.github/dependabot.yml, dst: .github/dependabot.yml}
      - {src: projects/python/common/.github/CODEOWNERS, dst: .github/CODEOWNERS}

    ##### MANDATORY — tests that survive every selection; no choice may delete them #####
    mandatory:
      - tests/unit/conftest.py
      - tests/unit/test_resources.py
      - tests/resources
      - tests/conftest.py
      - tests/unit/e_api/conftest.py
      - tests/support/psqlpy.py
      - tests/support/auth.py
      - tests/unit/e_api/test_main.py
      - tests/benchmark/e_api/test_main.py
      - tests/unit/e_api/api/test_middlewares.py
      - tests/unit/e_api/api/lifespan/test_infra.py
      - tests/unit/e_api/api/lifespan/test_providers.py
      - tests/unit/e_api/api/lifespan/test_sealed.py
      - tests/unit/e_api/api/lifespan/test_services.py

    ##### CHOICES — grouped by the wizard stage that owns them #####
    choices:
      # ·· modules ··
      - name: websockets
        group: modules
        label: telemetry websocket listener
        default: true
        paths: [src/e_api/websockets, src/e_api/models/telemetry.py, tests/unit/e_api/websockets, tests/unit/e_api/models/test_telemetry.py]
        prunes:
          - {file: src/e_api/main.py, pattern: '^from e_api\.websockets import telemetry\n'}
          - {file: src/e_api/main.py, pattern: '^    app\.register\(\n        Router\(path="/", route_handlers=list\(telemetry\.ws_routes\(\)\)[^\n]*\n    \)\n'}
          - {file: tach.toml, pattern: ', "e_api\.websockets"'}
          - {file: tach.toml, pattern: '\[\[modules\]\]\npath = "e_api\.websockets"\ndepends_on = \["e_api\.api", "e_api\.models", "e_api\.infra", "e_api\.infra\.errors"\]\n\n'}
          - {file: tests/unit/e_api/test_main.py, pattern: '^        "/ws/telemetry",\n'}

      - name: mcp
        group: modules
        label: MCP door (the resources as tools, served at /mcp)
        default: true
        paths: [src/e_api/mcp, src/e_api/api/lifespan/mcp.py, src/e_api/infra/mcp, src/e_api/infra/config/mcp.py, tests/unit/e_api/mcp, tests/unit/e_api/api/lifespan/test_mcp.py, tests/resources/mcp, tests/support/mcp.py]
        prunes:
          - {file: src/e_api/main.py, pattern: 'engines, mcp, providers', to: 'engines, providers'}
          - {file: src/e_api/main.py, pattern: '^from e_api\.mcp import mount\n'}
          - {file: src/e_api/main.py, pattern: '^from e_api\.mcp import registry as tools\n'}
          - {file: src/e_api/main.py, pattern: '^from e_api\.infra\.mcp\.guard import internal\n'}
          ### the one Settings names every cluster: the door's goes with the door, or the settings import fails.
          - {file: src/e_api/infra/settings.py, pattern: '^from e_api\.infra\.config\.mcp import McpSettings\n'}
          - {file: src/e_api/infra/settings.py, pattern: '^    McpSettings,\n'}
          - {file: src/e_api/main.py, pattern: '^            mcp\.lifespan,\n'}
          - {file: src/e_api/main.py, pattern: '^    ### the MCP door:[^\n]*\n    ###[^\n]*\n    app\.register\(Router\(path="/", route_handlers=list\(tools\.ROUTES\)[^\n]*\n    app\.register\(Router\(path="/", route_handlers=list\(mount\.routes\(\)\)[^\n]*\n'}
          - {file: tach.toml, pattern: '\[\[modules\]\]\npath = "e_api\.mcp"\ndepends_on = [^\n]*\n\n'}
          - {file: tach.toml, pattern: '\[\[modules\]\]\npath = "e_api\.infra\.mcp"\ndepends_on = [^\n]*\n\n'}
          - {file: tach.toml, pattern: '"e_api\.mcp", ', to: ''}
          - {file: tach.toml, pattern: ', "e_api\.infra\.mcp"\]', to: ']'}
          - {file: tach.toml, pattern: '^    "e_api\.mcp",\n'}
          - {file: tach.toml, pattern: '^    "e_api\.infra\.mcp",\n'}
          - {file: pyproject.toml, pattern: '^    ### the MCP door: the official SDK[^\n]*\n    "mcp>=[^"]*",\n    ###[^\n]*\n    "python-multipart>=[^"]*",\n'}
          - {file: pyproject.toml, pattern: '^    ### the MCP door.s tests drive[^\n]*\n    "httpx2>=[^"]*",\n'}
          - {file: pyproject.toml, pattern: '^"src/e_api/mcp/\*\*" = [^\n]*\n'}
          - {file: pyproject.toml, pattern: '^### the one module that speaks the MCP protocol[^\n]*\n"src/e_api/infra/mcp/server\.py" = [^\n]*\n'}
          - {file: pyproject.toml, pattern: '\n\[tool\.ruff\.lint\.flake8-tidy-imports\.banned-api\]\n"mcp\.server"\.msg = [^\n]*\n'}
          - {file: tests/unit/e_api/test_main.py, pattern: ', "mcp"\]', to: ']'}
          - {file: tests/unit/e_api/api/lifespan/test_sealed.py, pattern: ', "mcp"\}', to: '}'}
          - {file: README.md, pattern: ', mcp/ \(the MCP door\)', to: ''}
          - {file: README.md, pattern: ', the MCP client', to: ''}
          - {file: README.md, pattern: '^The MCP door \(`src/e_api/mcp/`\)[^\n]*\n\n'}
          - {file: docs/index.md, pattern: '^\| \[`e_api\.(api\.lifespan\.mcp|mcp\.[a-z.]+)`\][^\n]*\n'}
          - {file: .env.example, pattern: '^# MCP_[^\n]*\n'}

      # ·· stack ··
      - name: docker
        group: stack
        label: container image + compose service
        default: true
        paths: [Dockerfile, compose.yml, .dockerignore]
        prunes:
          - {file: Makefile, pattern: '^up: common ## docker compose up[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^down: ## docker compose down\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^build: common ## docker image build[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^logs: ## docker compose logs[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^(PORT|COMPOSE) \?=[^\n]*\n'}
          - {file: Makefile, pattern: ' up down build logs'}
          - {file: Makefile, pattern: ' up| down| build| logs'}
          - {file: README.md, pattern: '^(Dockerfile|compose\.yml)\s+#.*\n'}
          - {file: README.md, pattern: '^make up\s+#.*\n'}

      # ·· cicd ··
      - name: docs
        group: cicd
        label: generated API reference + GitHub Pages
        default: true
        paths: [zensical.toml, docs, scripts]
        prunes:
          - {file: Makefile, pattern: '^# — docs —\n[\s\S]*?(?=^# — aggregate)'}
          - {file: Makefile, pattern: ' docs-build'}
          - {file: Makefile, pattern: ' docs'}
          - {file: Makefile, pattern: ' scripts tests', to: ' tests'}
          - {file: pyproject.toml, pattern: '^docs = \[[\s\S]*?^\]\n'}
          - {file: pyproject.toml, pattern: '^    \{ include-group = "docs" \},\n'}

    ##### VERIFY — post-export pipeline; tests steps obey the user's confirmation #####
    verify: &verify
      - {name: git init, argv: [git, init, -q]}
      - {name: uv sync, argv: [uv, sync], tests: true}
      - {name: make check, argv: [make, check], tests: true}

    ##### FINALIZE — engine plumbing, never a user choice (strips the template's own machinery) #####
    finalize: &finalize
      - {file: Makefile, pattern: '^# — common —\n[\s\S]*?(?=^# — gates —)'}
      - {file: Makefile, pattern: '^COMMON_SRC \?= .*\n'}
      - {file: Makefile, pattern: '^COMMON_ROOT \?= .*\n'}
      - {file: Makefile, pattern: ' common-check'}
      - {file: Makefile, pattern: ' common\b(?![/-])'}
      - {file: .gitignore, pattern: '^# (generated|materialized).*\n'}
      ### every line that hides the common: a generated project has no materializer, so it tracks its common whole.
      - {file: .gitignore, pattern: '^!?src/\w+/(infra|ops|ports|providers|engines|processors)/(config/)?\*?\n'}
      - {file: .gitignore, pattern: '^(prek\.toml|\.(gitattributes|python-version))\n'}
      - {file: .gitignore, pattern: '^\.github/(dependabot\.yml|CODEOWNERS)\n'}
      - {file: pyproject.toml, pattern: ', shared infra materialized from projects/python/common'}
      - {file: pyproject.toml, pattern: '^    ### structural rewrite.*materialization time.*\n    "libcst>=[^"]*",\n'}
      - {file: Makefile, pattern: ' — infra/ops/ports/providers/engines/processors materialized from \$\(COMMON_SRC\)'}
      - {file: README.md, pattern: '^.*\b(GENERATED|make common)\b.*\n'}
      ### a detached project owns its infra set: `clean` must not delete source the generator no longer restores.
      - {file: Makefile, pattern: ' \$\(PACKAGE\)/infra \$\(PACKAGE\)/ops \$\(PACKAGE\)/ports \$\(PACKAGE\)/providers \$\(PACKAGE\)/engines \$\(PACKAGE\)/processors prek\.toml \.gitattributes \.python-version'}
      - {file: Makefile, pattern: ' \+ materialized common'}
      ### an e- service runs as one word: its compose service, container and host name drop the brand's hyphen (egnosis).
      - {file: compose.yml, pattern: '^(  |    container_name: |    hostname: )e-([a-z0-9]+)(:?)$', to: '\1e\2\3'}

  cli:
    source: projects/python/cli
    package: e_cli
    brand: e-cli
    drops: [uv.lock, scripts, .github/workflows, .github/ci.map.yml, .github/ci.vars.example, .github/INSTALL.md, tests/unit/test_ci_contract.py]
    common: {root: projects/python/common, package: e_infra, skip: [ops/tui]}
    materials: *materials

    ##### MANDATORY — the harness and the tree contract survive every selection #####
    mandatory:
      - tests/unit/conftest.py
      - tests/unit/test_resources.py
      - tests/resources
      - tests/unit/e_cli/conftest.py
      - tests/unit/e_cli/test_cli.py

    verify: *verify
    finalize: *finalize
    finalize_extra:
      - {file: Makefile, pattern: ' scripts', to: ''}
  graph:
    source: projects/python/graph
    package: e_graph
    brand: e-graph
    drops: [uv.lock, scripts/materialize.py, .github/workflows, .github/ci.map.yml, .github/ci.vars.example, .github/INSTALL.md, tests/unit/test_ci_contract.py]
    common: {root: projects/python/common, package: e_infra, skip: [ops/tui]}
    materials: *materials

    mandatory:
      - tests/unit/conftest.py
      - tests/resources
      - tests/unit/e_graph/conftest.py

    choices:
      # ·· stack ··
      - name: docker
        group: stack
        label: container image + compose service
        default: true
        paths: [Dockerfile, compose.yml, .dockerignore]
        prunes:
          - {file: Makefile, pattern: '^up: common ## docker compose up[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^down: ## docker compose down\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^build: common ## docker image build[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^logs: ## docker compose logs[^\n]*\n(?:\t[^\n]*\n)+'}
          - {file: Makefile, pattern: '^(PORT|COMPOSE) \?=[^\n]*\n'}
          - {file: Makefile, pattern: ' up down build logs'}
          - {file: Makefile, pattern: ' up| down| build| logs'}

      # ·· cicd ··
      - name: docs
        group: cicd
        label: generated API reference + GitHub Pages
        default: true
        paths: [zensical.toml, docs, scripts]
        prunes:
          - {file: Makefile, pattern: '^# — docs —\n[\s\S]*?(?=^# — aggregate)'}
          - {file: Makefile, pattern: ' docs-build'}
          - {file: Makefile, pattern: ' docs'}
          - {file: Makefile, pattern: ' scripts tests', to: ' tests'}
          - {file: pyproject.toml, pattern: '^docs = \[[\s\S]*?^\]\n'}
          - {file: pyproject.toml, pattern: '^    \{ include-group = "docs" \},\n'}

    verify: *verify
    finalize: *finalize

  tui:
    source: projects/python/tui
    package: e_tui
    brand: e-tui
    drops: [uv.lock, .github/workflows, .github/ci.map.yml, .github/ci.vars.example, .github/INSTALL.md, tests/unit/test_ci_contract.py]
    common: {root: projects/python/common, package: e_infra}
    materials: *materials

    mandatory:
      - tests/unit/conftest.py
      - tests/resources

    verify: *verify
    finalize: *finalize
