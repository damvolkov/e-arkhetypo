services:
  clef:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: clef
    hostname: clef
    restart: unless-stopped
    ipc: host
    labels:
      stack.category: "llm"
      stack.port: "8081"
    ports:
      # Clef-Flash (modelo de decisión, una pasada) — 8081 para no pisar a llamacpp (8080)
      - "${CLEF_PORT:-8081}:8080"
    volumes:
      - clef-cache:/home/app/.cache/llama.cpp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # Pull-and-run: sin GGUF en disco, el servidor se descarga Clef-Flash Q4_K_M (6.5 GB) del Hub a su
    # caché la primera vez. La cabeza de decisión puntúa todas las opciones en UN batch: -ub ≥ prompt
    # completo (~4k tokens de estado por defecto; CLEF_UBATCH lo sube a cambio de VRAM). Pide el batch
    # entero: necesita el prompt completo — estados mayores los sirve jev por la vía vllm (reading).
    # 6.9 GB de VRAM: no convive con un 27B/gemma-26B residente en la misma tarjeta — con llm/vllm y
    # llm/embed arriba, el patrón de servicio es jev→reading; apagar vllm (gpu-decide) para jev→clef.
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      exec /app/llama-server -hf ggml-org/Clef-Flash-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080
      -c ${CLEF_CTX:-32768} -ngl 99 -b ${CLEF_BATCH:-32768} -ub ${CLEF_UBATCH:-4096}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - stack

volumes:
  clef-cache:

networks:
  stack:
    name: stack
