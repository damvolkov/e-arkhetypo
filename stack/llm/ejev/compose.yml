services:
  clef:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: clef
    hostname: clef
    restart: unless-stopped
    ipc: host
    labels:
      stack.category: "llm"
      stack.port: "8081"
    ports:
      # Clef-Flash (modelo de decisión, una pasada) — 8081 para no pisar a llamacpp (8080)
      - "${CLEF_PORT:-8081}:8080"
    volumes:
      - clef-cache:/home/app/.cache/llama.cpp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # Pull-and-run: sin GGUF en disco se descarga Clef-Flash Q4_K_M (6.5 GB) del Hub a su caché.
    # La cabeza conjunta puntúa todas las opciones en UN batch: -ub ≥ prompt (~4k tokens de estado
    # por defecto; CLEF_UBATCH lo sube a cambio de VRAM). 6.9 GB: no convive con un 26B residente.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'model=/models/Clef-Flash-Q4_K_M.gguf; [ -f "$${model}" ] && source="-m $${model}" || source="-hf ggml-org/Clef-Flash-GGUF:Q4_K_M"; exec /app/llama-server $${source} --host 0.0.0.0 --port 8080 -c ${CLEF_CTX:-32768} -ngl 99 -b ${CLEF_BATCH:-32768} -ub ${CLEF_UBATCH:-4096}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    networks:
      - stack

  ejev:
    image: ghcr.io/damvolkov/e-jev:latest
    container_name: ejev
    hostname: ejev
    restart: unless-stopped
    depends_on:
      clef:
        condition: service_started
    labels:
      stack.category: "llm"
      stack.port: "45160"
    ports:
      # e-jev typed decisions — System One API (necesita clef; con vllm arriba, también sirve reading)
      - "${JEV_PORT:-45160}:45160"
    volumes:
      - ejev-data:/data
    environment:
      - JEV_VLLM_URL=http://vllm:8000/v1
      - JEV_VLLM_API_KEY=${VLLM_API_KEY:-local-dev}
      - JEV_MODEL=${JEV_MODEL:-clef}
      - JEV_PERMUTATIONS=${JEV_PERMUTATIONS:-1}
      - JEV_OTLP_ENDPOINT=${JEV_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      # e-jev = clef a secas. Para re-abrir la vía LLM (largos / extract): añade
      # {"id":"reading","kind":"reading","url":""} a JEV_BACKENDS y levanta llm/vllm
      # (o un servidor con el dialecto del reader). Backend caído = ruta que falla: jev sirve lo que puede.
      - JEV_BACKENDS=${JEV_BACKENDS:-[{"id":"clef","kind":"systemone","url":"http://clef:8080","model":"clef","languages":["any"],"max_options":255,"max_state_tokens":4096}]}
      - JEV_DECISION_LOG=${JEV_DECISION_LOG:-/data/decisions.jsonl}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:45160/ready')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - stack

volumes:
  clef-cache:
  ejev-data:

networks:
  stack:
    name: stack
