services:
  jev:
    image: ghcr.io/damvolkov/e-jev:latest
    container_name: jev
    hostname: jev
    restart: unless-stopped
    labels:
      stack.category: "llm"
      stack.port: "45160"
    ports:
      # e-jev typed decisions over vLLM, escucha en 45160 (necesita llm/vllm)
      - "${JEV_PORT:-45160}:45160"
    volumes:
      - jev-data:/data
    environment:
      - JEV_VLLM_URL=http://vllm:8000/v1
      - JEV_VLLM_API_KEY=${VLLM_API_KEY:-local-dev}
      - JEV_MODEL=${LLM_SERVED_NAME:-gemma4-26b-a4b}
      - JEV_PERMUTATIONS=${JEV_PERMUTATIONS:-1}
      - JEV_OTLP_ENDPOINT=${JEV_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      # La flota: clef decide (una pasada, 6.9 GB) y vllm lee (teacher: largo contexto, extract,
      # destilación). Un backend caído degrada a ruta que falla — jev arranca y sirve lo que puede.
      # Sin clef en la máquina, borra la primera entrada (reading sirve solo).
      - JEV_BACKENDS=[{"id":"clef","kind":"systemone","url":"http://clef:8080","model":"clef","languages":["any"],"max_options":255,"max_state_tokens":4096},{"id":"reading","kind":"reading","url":""}]
      # El corpus para re-ajustar y destilar: cada decisión cruda (estado, pregunta, scores, backend).
      - JEV_DECISION_LOG=${JEV_DECISION_LOG:-/data/decisions.jsonl}
      # Ajuste por (backend, kind, modelo): JEV_CALIBRATION=/data/calibration.json tras `ejev calibrate`.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:45160/ready')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - stack

volumes:
  jev-data:

networks:
  stack:
    name: stack
