services:

  strata:
    # The LLM slot's alternative: exactly one of strata/vllm ever holds this card, network name and port; vllm is
    # the default since 2026-10-28. Qwen3.8-Flash-Next (125B MoE, 6B active): every expert lives in host RAM, the hot
    # ones cache on the GPU, the model's MTP layer drafts. Measured on a 14900K/4090/188 GB beside TEI, the same 20.6
    # GiB of card as vllm's Gemma: IQ3_S (the quant that matches BF16; vision, 64k) 57-86 tok/s decode, 4.1k prefill,
    # 59 tok/s at 8 concurrent, prefix reuse 2x; IQ2_XS 92-120 tok/s. Gemma on vllm: 175 tok/s, ~10k prefill, 760 at 8.
    # Its speed is the VRAM expert cache: capped to 8 GiB, IQ2_XS falls to 35-42 tok/s. No logprobs, no /tokenize.
    # The image is compiled by ./setup.sh (the engine is built at docker build, never at run);
    # the model files and the prepared packs live in the strata-data volume.
    # API: /v1/chat/completions (OpenAI), /v1/messages (Anthropic), /v1/responses — and the
    # `aliases` list in /data/config/strata-<model>.json is what answers to demian-model.
    image: strata:${STRATA_TAG:-0.1.44.1}
    container_name: strata
    hostname: strata
    restart: unless-stopped
    labels:
      stack.category: "llm"
      stack.port: "8000"
    ports:
      # default 8000 — the LLM slot, OpenAI + Anthropic compatible
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - strata-data:/data
    environment:
      - FAMILY=${STRATA_FAMILY:-qwen}
      - MODEL=${STRATA_MODEL:-IQ2_XS}
      - CONTEXT=${STRATA_CONTEXT:-32768}
      - VISION=no
      - KV=int8
      - PORT=8000
      - API_KEY=${LLM_API_KEY:-local-dev}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # The engine page-locks the experts (memlock must be unlimited) and needs >10 s to
    # release them on stop: docker's default 10 s kills it (exit 137) — keep the grace.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    stop_grace_period: 60s
    # 1/4 of the default CPU weight: every core while the desktop idles, it yields under contention.
    cpu_shares: 256
    # One slot, one address: `llm` is the name a consumer should use; `vllm` and `strata` stay for
    # those configured before it. vllm/compose.yml answers to the same three, port, key and model name.
    networks:
      stack:
        aliases:
          - llm
          - vllm

volumes:
  strata-data:

networks:
  stack:
    name: stack
