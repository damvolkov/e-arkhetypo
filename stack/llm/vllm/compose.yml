services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.31.0}
    container_name: vllm
    hostname: vllm
    restart: unless-stopped
    ipc: host
    labels:
      stack.category: "llm"
      stack.port: "8000"
    ports:
      # default 8000 — vLLM OpenAI-compatible server
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # Sized for one RTX 4090 (24 GB, Ada), A/B 2026-10-14: Gemma 4 26B-A4B (MoE, 4B active) over Qwen3.6/3.8-27B,
    # Qwen3.5-9B and Qwen3.6-35B-A3B (OOM beside the desktop) — 722 tok/s at 16 seqs (Qwen 27B dense: 135 at 8),
    # TTFT ~130 ms single, tools 38/40, KV extraction on par. ~16 GiB weights leave room for CUDA graphs and a
    # 143k-token fp8 KV pool. 0.89 = total − ~2.2 GiB desktop slot (vLLM budgets over total VRAM, not free VRAM).
    # Priority scheduling: interactive/memory clients send nothing (0); bulk clients (benchmarks) send priority > 0.
    # Reasoning off by default for chat clients (CortexDB extraction, small tasks); a request opts in with
    # chat_template_kwargs {enable_thinking: true}. Image pinned: a pull-on-start unit drifts on `latest`.
    command: >-
      --model ${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      --served-model-name ${LLM_SERVED_NAME:-gemma4-26b-a4b}
      --language-model-only
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.89}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      --kv-cache-dtype ${VLLM_KV_DTYPE:-fp8}
      --max-num-seqs ${VLLM_MAX_SEQS:-16}
      --max-num-batched-tokens ${VLLM_MAX_BATCHED:-2048}
      --enable-prefix-caching
      --scheduling-policy priority
      --structured-outputs-config.backend xgrammar
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":false}'
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --port 8000
      --api-key ${VLLM_API_KEY:-local-dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    networks:
      - stack

volumes:
  vllm-cache:

networks:
  stack:
    name: stack
