services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.31.0}
    container_name: vllm
    hostname: vllm
    restart: unless-stopped
    ipc: host
    labels:
      stack.category: "llm"
      stack.port: "8000"
    ports:
      # default 8000 — vLLM OpenAI-compatible server
      # default 8000 — the LLM slot, the same port strata takes
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # trazas a watch/phoenix, en el proyecto de jev: los spans de vLLM cuelgan del readout que los causó
      - OTEL_SERVICE_NAME=vllm
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=e-jev
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # Sized for one RTX 4090 (24 GB, Ada). The LLM slot's default since 2026-10-28 (llm/strata the alternative): the
    # final fight on one card, the same 20.6 GiB, Gemma here vs Qwen3.8-Flash-Next IQ3_S on strata — 175 vs 57-86
    # tok/s decode, ~10k vs 4.1k prefill, 760 vs 59 tok/s at 8 concurrent, prefix reuse 34x vs 2x, and jev's logprob
    # reader needs /tokenize, which strata does not speak. Serves the demian-model alias: no consumer changes on a swap.
    # Original A/B: Gemma 4 26B-A4B (MoE, 4B active) over Qwen3.6/3.8-27B,
    # Qwen3.5-9B and Qwen3.6-35B-A3B (OOM beside the desktop) — 722 tok/s at 16 seqs (Qwen 27B dense: 135 at 8),
    # TTFT ~130 ms single, tools 38/40, KV extraction on par. ~16 GiB weights leave room for CUDA graphs and a
    # fp8 KV pool. 0.86 · 131072 with the desktop on the iGPU and TEI (embed + reranker, 2.6 GiB) beside it: 20.58 of
    # 23.52 GiB free at start, 0.87 OOMs capturing CUDA graphs; 0.86 → 212k KV tokens, embed+rerank stress 0 failures,
    # peak 23.7 / 24.0 GiB (2026-10-28). A desktop on this card takes ~1.4 GiB more: lower VLLM_GPU_UTIL to ~0.80.
    # Batches of 4096 bought no prefill (6.0 vs 6.2 s at 60k) and cost 50k tokens of KV: 2048 stays.
    # Priority scheduling: interactive/memory clients send nothing (0); bulk clients (benchmarks) send priority > 0.
    # Reasoning off by default for chat clients (CortexDB extraction, small tasks); a request opts in with
    # chat_template_kwargs {enable_thinking: true}. Image pinned: a pull-on-start unit drifts on `latest`.
    # Structured output: xgrammar with no free whitespace — Gemma under a JSON schema otherwise loops on newlines
    # after the first field until max_tokens (6/6 at temperature 0, 2026-10-19); per request the option is ignored.
    # Vision on for docling's figure and chart stages (rag/docling): +1.07 GiB of vision-tower weights, −6.2 % KV
    # (129k → 121k tokens at 0.83, 2026-10-26). Video off: its 2496-token item would force max-num-batched-tokens up.
    command: >-
      --model ${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      --served-model-name ${LLM_SERVED_NAME:-gemma4-26b-a4b demian-model}
      --limit-mm-per-prompt '{"video":0}'
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.86}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-131072}
      --kv-cache-dtype ${VLLM_KV_DTYPE:-fp8}
      --max-num-seqs ${VLLM_MAX_SEQS:-16}
      --max-num-batched-tokens ${VLLM_MAX_BATCHED:-2048}
      --enable-prefix-caching
      --scheduling-policy priority
      --structured-outputs-config.backend xgrammar
      --structured-outputs-config.disable_any_whitespace true
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":false}'
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --port 8000
      --api-key ${LLM_API_KEY:-local-dev}
      --otlp-traces-endpoint ${VLLM_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    # The same slot as strata: `llm`, `vllm` and `strata` all reach whichever of the two holds the card.
    networks:
      stack:
        aliases:
          - llm
          - strata

volumes:
  vllm-cache:

networks:
  stack:
    name: stack
