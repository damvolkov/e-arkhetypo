services:
  cortexdb:
    # Long-term memory for agents (Apache-2.0): events → facts, beliefs, entity graph; hybrid recall.
    # OpenHuman ≥ 0.64.15 has no local memory without it (`[memory] engine = "cortexdb"`).
    # Pinned: v0.11 migrates the data dir one way (label io.cortexdb.one-way-below) — bump on purpose.
    image: cortexdb/cortexdb:${CORTEXDB_TAG:-v0.10.4}
    container_name: cortexdb
    hostname: cortexdb
    restart: unless-stopped
    command: ["3141", "/data"]
    labels:
      stack.category: "mem"
      stack.port: "3141"
    ports:
      # default 3141 — /v1 API (recall, answer, experience, facts, beliefs, export); loopback: it holds the memory
      - "127.0.0.1:${CORTEXDB_PORT:-3141}:3141"
    volumes:
      # LSM store, WAL, vector/graph/fulltext indexes — never inside a synced vault: export, don't share
      - cortexdb-data:/data
      - ./cortex.toml:/data/cortex.toml:ro
    environment:
      - CORTEX_API_KEY=${CORTEX_API_KEY:?set CORTEX_API_KEY (openssl rand -hex 32)}
      - CORTEX_DEPLOYMENT_PRESET=dev_local
      # embeddings: the shared TEI — it must accept 64 inputs per request (llm/embed)
      - CORTEX_EMBEDDING_URL=http://embed:80/v1
      - CORTEX_EMBEDDING_API_KEY=local
      - CORTEX_EMBEDDING_MODEL=${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - CORTEX_EMBEDDING_HTTP_TIMEOUT_SECS=${CORTEXDB_EMBED_TIMEOUT:-300}
      - CORTEX_EMBEDDING_DIMS=${CORTEXDB_EMBED_DIMS:-1024}
      # extraction, enrichment, answers, verification: vllm
      - OPENAI_API_KEY=${VLLM_API_KEY:-local-dev}
      - CORTEX_LLM_URL=http://vllm:8000/v1
      - CORTEX_ENTITY_API_KEY=${VLLM_API_KEY:-local-dev}
      - CORTEX_LLM_MODEL=${LLM_SERVED_NAME:-demian-model}
      - CORTEX_ENRICHMENT_URL=http://vllm:8000/v1
      - CORTEX_ENRICHMENT_API_KEY=${VLLM_API_KEY:-local-dev}
      - CORTEX_ENRICHMENT_MODEL=${LLM_SERVED_NAME:-demian-model}
      # without a delay the fact/belief pipeline stays empty
      - CORTEX_ENRICHMENT_DELAY_SECONDS=0
      - CORTEX_ANSWER_PROVIDER=openai
      - CORTEX_ANSWER_URL=http://vllm:8000/v1
      - CORTEX_ANSWER_API_KEY=${VLLM_API_KEY:-local-dev}
      - CORTEX_ANSWER_MODEL=${LLM_SERVED_NAME:-demian-model}
      - CORTEX_VERIFIER_URL=http://vllm:8000/v1
      - CORTEX_VERIFIER_API_KEY=${VLLM_API_KEY:-local-dev}
      - CORTEX_VERIFIER_MODEL=${LLM_SERVED_NAME:-demian-model}
      # keep the verifier's answer inside the served context
      - CORTEX_VERIFIER_MAX_TOKENS=${CORTEXDB_VERIFIER_TOKENS:-4096}
      # retrieval: graph-fused, belief layers auto-built, per-question routing
      - CORTEX_ENTITY_GRAPH=1
      - CORTEX_V1_LAYERS_AUTO=1
      - CORTEX_AUTO_ROUTE=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3141/v1/admin/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - stack

  cortexdb-mirror:
    # CortexDB's graph as Obsidian markdown: one note per entity, a heading per relation, [[links]] between
    # entities and to the vault notes they came from. Read-only output; stdlib Python, nothing built.
    image: python:3-alpine
    container_name: cortexdb-mirror
    hostname: cortexdb-mirror
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # files owned by the vault's user (Obsidian, Syncthing)
    command: ["python", "-u", "/app/mirror.py"]
    labels:
      stack.category: "mem"
    volumes:
      - ./mirror.py:/app/mirror.py:ro
      # the vault, read-only: to link entities to the notes they were read from
      - ${CORTEXDB_VAULT_DIR:-./vault}:/vault:ro
      # where the mirror lives — point it inside the vault (e.g. <vault>/cortex) for Obsidian's graph
      - ${CORTEXDB_MIRROR_DIR:-./vault/cortex}:/mirror
    environment:
      - CORTEX_URL=http://cortexdb:3141
      - CORTEX_API_KEY=${CORTEX_API_KEY:?set CORTEX_API_KEY}
      - MIRROR_EVERY=${CORTEXDB_MIRROR_EVERY:-600}
      - MIRROR_SCOPES=${CORTEXDB_MIRROR_SCOPES:-app:tinymemory/source:files/app:documents}
      # memory source id → vault folder (the mirror files each entity under its main source's folder)
      - MIRROR_SOURCES=${CORTEXDB_MIRROR_SOURCES:-}
    depends_on:
      cortexdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/mirror.ok -mmin -30 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - stack

volumes:
  cortexdb-data:

networks:
  stack:
    name: stack
