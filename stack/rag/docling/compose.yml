# Max-quality extraction without holding the GPU: figure description and chart extraction run on gemma through
# llm/vllm (vision on), so an idle docling costs the card nothing and a concurrent one only shares vLLM's batch.
# Local models stay on CPU: the i9-14900K lacks AVX-512/bf16, so bf16 VLMs crawl there (80+ min vs 137 s on a
# 90-page survey, 2026-10-26) — CodeFormulaV2 is pinned to fp32, and the image's OMP_NUM_THREADS=4 is lifted.
# The models volume seeds from the image; add the presets' extra weights once:
#   docker compose run --rm docling docling-tools models download tableformerv2 code_formula
services:
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    hostname: docling
    restart: unless-stopped
    labels:
      stack.category: "rag"
      stack.port: "5001"
    ports:
      # Docling — extraccion de documentos
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      - docling-data:/app/data
      - docling-models:/opt/app-root/src/.cache/docling/models
    environment:
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_UI:-1}
      - DOCLING_SERVE_HOST=0.0.0.0
      - DOCLING_SERVE_PORT=5001
      - OMP_NUM_THREADS=${DOCLING_THREADS:-32}
      - DOCLING_NUM_THREADS=${DOCLING_THREADS:-32}
      - 'DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true'
      - 'DOCLING_SERVE_CUSTOM_PICTURE_DESCRIPTION_PRESETS={"gemma": {"batch_size": 8, "scale": 2.0, "picture_area_threshold": 0.0, "prompt": "Describe this figure from a technical document precisely: its type, every labelled component, the relationships or flow it shows, and any text it contains. Answer in dense, factual plain prose: no markdown, no headings, no lists, no bold.", "generation_config": {"max_new_tokens": 512, "do_sample": false}, "engine_options": {"engine_type": "api_openai", "url": "http://vllm:8000/v1/chat/completions", "headers": {"Authorization": "Bearer ${LLM_API_KEY:-local-dev}"}, "params": {"model": "demian-model"}, "timeout": 300.0, "concurrency": 4}, "model_spec": {"name": "gemma4-26b-a4b", "default_repo_id": "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit", "prompt": "Describe this figure from a technical document precisely: its type, every labelled component, the relationships or flow it shows, and any text it contains. Answer in dense, factual plain prose: no markdown, no headings, no lists, no bold.", "response_format": "plaintext", "supported_engines": ["api_openai"], "max_new_tokens": 512}}}'
      - 'DOCLING_SERVE_DEFAULT_PICTURE_DESCRIPTION_PRESET=gemma'
      - 'DOCLING_SERVE_CUSTOM_CHART_EXTRACTION_PRESETS={"gemma": {"engine_options": {"engine_type": "api_openai", "url": "http://vllm:8000/v1/chat/completions", "headers": {"Authorization": "Bearer ${LLM_API_KEY:-local-dev}"}, "params": {"model": "demian-model"}, "timeout": 300.0, "concurrency": 4}, "model_spec": {"name": "gemma4-26b-a4b", "default_repo_id": "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit", "prompt": "Extract the data of this chart as CSV.", "response_format": "plaintext", "supported_engines": ["api_openai"], "max_new_tokens": 2048}, "use_natural_language_prompts": true, "chart2csv": true, "chart2summary": true, "chart2code": true}}'
      - 'DOCLING_SERVE_DEFAULT_CHART_EXTRACTION_PRESET=gemma'
      - 'DOCLING_SERVE_CUSTOM_CODE_FORMULA_PRESETS={"codeformulav2_fp32": {"engine_options": {"engine_type": "transformers", "torch_dtype": "float32"}, "model_spec": {"name": "CodeFormulaV2", "default_repo_id": "docling-project/CodeFormulaV2", "prompt": "", "response_format": "plaintext", "supported_engines": ["transformers"]}}}'
      - 'DOCLING_SERVE_DEFAULT_CODE_FORMULA_PRESET=codeformulav2_fp32'
      - 'DOCLING_SERVE_DEFAULT_TABLE_STRUCTURE_PRESET=tableformer_v2'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - stack

volumes:
  docling-data:
  docling-models:

networks:
  stack:
    name: stack
