use_default_settings: true

general:
  instance_name: "SearXNG_Local"
  debug: false
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: "google"
  autocomplete_min: 4
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "ultrasecretkey123"
  limiter: false
  image_proxy: true

redis:
  url: "redis://:redis_password@redis:6379/0"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark

outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20

# Every upstream engine on (image 2026.9.17, probed one by one 2026-10-07): keyless ones answer; keyed ones are left to upstream.
# yacy: the bundled rag/yacy peer (global = its index plus the P2P network).
# Off: shadow libraries, and engines broken upstream (parse errors, crashes, HTTP/SSL/API errors).
# Timeouts cap a query near 5 s with ~35 engines answering: clients like OpenHuman cut at 10 s.
