# Incluido por rag/searxng: YaCy es el índice propio de SearXNG y no se levanta solo.
services:
  yacy:
    image: yacy/yacy_search_server:latest
    container_name: yacy
    hostname: yacy
    restart: unless-stopped
    labels:
      stack.category: "rag"
      stack.port: "8090"
    ports:
      # YaCy admin/búsqueda, solo loopback: el admin por defecto es admin/yacy
      - "127.0.0.1:${YACY_PORT:-8090}:8090"
    volumes:
      - yacy_data:/opt/yacy_search_server/DATA
    logging:
      options:
        max-size: "200m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - stack

volumes:
  yacy_data:

networks:
  stack:
    name: stack
