services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    labels:
      stack.category: "storage"
      stack.port: "9000"
      # parked 2026-10: quay.io retired the MinIO images and nothing uses this service — kept for
      # reference, disabled on the host; the version bots skip parked services until it is removed.
      stack.parked: "true"
    ports:
      # default 9000 API / 9001 Console
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stack

volumes:
  minio-data:

networks:
  stack:
    name: stack
