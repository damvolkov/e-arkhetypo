# Upstream's routes, plus /data: the drop folder, served read-only so /editor?json= can load it from the same origin.
server {
    listen 8080;
    root  /app;
    include /etc/nginx/mime.types;

    location /editor {
        try_files $uri /editor.html;
    }

    location /widget {
        try_files $uri /widget.html;
    }

    location /docs {
        try_files $uri /docs.html;
    }

    location /data/ {
        alias /data/;
        autoindex on;
        add_header Cache-Control "no-store";
    }
}
