##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-core"
dynamic = ["version"]
description = "e-stack common core: layered settings composer, structured logger, crypto engine, state, ops file discovery, service adapters"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### logging #####
    "structlog>=26.1",
    ##### data #####
    "msgspec>=0.21",
    "e-serde>=0.6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    ##### crypto #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "anyio>=4.15.1",
    ##### stores #####
    "redis>=6.2",
    "aiosqlite>=0.20",
    ##### background — awa: a Rust Postgres job queue, the durable engine #####
    "awa-pg>=0.6.9",
    ##### http #####
    "wreq>=0.10",
    ##### telemetry #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ##### contracts #####
    "beartype>=0.22.9",
    ##### documents — liteparse (Rust, in-process) first, docling-serve for what it reads better; polars frames #####
    "liteparse>=2.14",
    "polars>=2.0",
    ##### tui #####
    "textual>=8.2",
    "anytomd[full]>=1.3.1.post2,<1.4",
]

[project.urls]
Homepage = "https://github.com/damvolkov/e-templates"
Source = "https://github.com/damvolkov/e-templates"
Issues = "https://github.com/damvolkov/e-templates/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "fakeredis>=2.38.0",
    ### the queue tests create, and take down, their Postgres databases: an admin connection outside any transaction.
    "psqlpy>=0.12",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.6",
    "properdocs>=1.6.7",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "prek>=0.4",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "2026-10-20"
### e-serde is first-party (the compose loader); exempt it from the freshness window.
exclude-newer-package = { "e-serde" = "2100-01-01T00:00:00Z" }
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_core"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### NON_SERVICE is an exclusion vocabulary for host tokens, not a socket bind.
"src/e_core/ops/compose.py" = ["S104"]

[tool.ruff.lint.isort]
known-first-party = ["e_core"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "e_core.core.settings.base.BaseSettings",
    "msgspec.Struct",
    "e_core.core.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
### tests/unit on the path: a test imports a conftest's plain helpers by name (`from e_core.conftest import settled`).
pythonpath = ["src", "tests/unit"]
strict = true
filterwarnings = [
    "error",
    ### joserfc warns on every EdDSA JWT per RFC 9864 (non-committing signature); kept as an offered alg.
    "ignore::joserfc.errors.SecurityWarning",
]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "db: needs the test Postgres at POSTGRES_TEST_DSN (default the stack's ParadeDB :45011) — skipped when unreachable",
]

##### COVERAGE #####
[tool.coverage.run]
source_pkgs = ["e_core"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']

##### UV #####
