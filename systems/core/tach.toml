##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs", "common"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
layers = ["processors", "adapters", "core", "ops"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_core.processors"
layer = "processors"
depends_on = []

[[modules]]
path = "e_core.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_core.core"
layer = "core"
depends_on = []

[[modules]]
path = "e_core.ops"
layer = "ops"
depends_on = []
