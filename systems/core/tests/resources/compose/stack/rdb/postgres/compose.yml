services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    labels:
      stack.category: "rdb"
      stack.port: "5432"
    ports:
      # default 5432 — PostgreSQL (+ pgvector: dobla como vdb)
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${PG_DB:-postgres}
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stack

volumes:
  postgres-data:

networks:
  stack:
    name: stack
