kind: deterministic
name: EXT-amounts
description: The offering's money — aggregate principal, the per-note figures, wherever the cover prints them.
runner: agnostic/text/match
check: agnostic/context/present
args:
  runner:
    many: true
    pattern: '(?P<currency_symbol>\$)(?P<aggregate_principal>[\d,]+)(?=[^$]{0,90}Trigger Autocallable)|Per Note\s*\|\s*\$(?P<offering_price>[\d,.]+)\s*\||(?:each Note corresponding to|offered at a minimum investment of \d+ Notes at|offered for a minimum investment of \d+ Notes \(each Note corresponding to)\s+\$(?P<denomination>[\d,.]+)\s*(?:in Stated Principal|per Note)'
  check:
    needs: [ingest/ING-document]
output:
  type: object
  properties:
    currency_symbol: {type: array, minItems: 1, items: {type: string, pattern: "^\\$"}}
    aggregate_principal: {type: array, minItems: 1, items: {type: string, pattern: "^\\d[\\d,]*$"}}
    denomination: {type: array, minItems: 1, items: {type: string, pattern: "^\\d+(\\.\\d{1,3})?$"}}
    offering_price: {type: array, minItems: 1, items: {type: string, pattern: "^\\d[\\d,]*(\\.\\d{1,3})?$"}}
  required: [currency_symbol, aggregate_principal, denomination, offering_price]
  additionalProperties: false
