kind: semantic
name: EXT-autocall
description: The automatic call — the Initial Value, the level that triggers it, what is paid, and when it cannot happen.
pre: agnostic/document/pages
check: agnostic/context/present
args:
  pre: {first: 1, most: 0}
  check: {needs: [ingest/ING-document]}
tier: medium
instructions: >-
  From the cover page's Investment Description and Features: the Initial Value of the Underlying as a
  printed number, the level at or above which the notes are automatically called on a quarterly
  Observation Date (a number), what the holder receives upon that automatic call (a short exact
  phrase), and whether the notes can be called on the Final Observation Date.
wiki: [autocall]
output:
  type: object
  properties:
    initial_value: {type: number, minimum: 0.01}
    call_level: {type: number, minimum: 0.01}
    payout: {type: string, minLength: 8, maxLength: 160}
    callable_on_final: {type: boolean}
  required: [initial_value, call_level, payout, callable_on_final]
  additionalProperties: false
