kind: semantic
name: EXT-dates
description: The note's calendar — pricing, issue, final observation and maturity dates, as ISO dates.
pre: agnostic/document/pages
check: agnostic/context/present
args:
  pre: {first: 2, words: [final valuation date, final observation date], most: 1}
  check: {needs: [ingest/ING-document]}
tier: medium
instructions: >-
  From the cover page's Key Dates table: the Trade Date (pricing), the Issue Date, the Maturity Date and
  the Final Observation Date — each printed like "November 6, 2025" — written as ISO dates (YYYY-MM-DD).
output:
  type: object
  properties:
    pricing_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
    issue_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
    final_observation_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
    maturity_date: {type: string, pattern: "^20[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$"}
  required: [pricing_date, issue_date, final_observation_date, maturity_date]
  additionalProperties: false
