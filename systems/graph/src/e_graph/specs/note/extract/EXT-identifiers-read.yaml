kind: semantic
name: EXT-identifiers-read
description: The note's CUSIP and ISIN, read off the cover page when the regex cannot find them.
pre: agnostic/document/pages
check: agnostic/context/present
args:
  pre: {first: 1, most: 0}
  check: {needs: [ingest/ING-document]}
tier: low
instructions: >-
  From the cover page of this pricing supplement for structured notes: the CUSIP and the ISIN of the
  notes, exactly as printed next to the words "CUSIP" or "CUSIP/ISIN". A CUSIP is nine characters of
  digits and capital letters; an ISIN is twelve, beginning with the two-letter country code.
output:
  type: object
  properties:
    cusip: {type: string, pattern: "^[0-9A-Z]{6}\\d{2}[0-9A-Z]$"}
    isin: {type: string, pattern: "^[A-Z]{2}[A-Z0-9]{9}\\d$"}
  required: [cusip, isin]
  additionalProperties: false
