kind: deterministic
name: EXT-registration
description: The Securities Act registration number the pricing supplement is filed under.
runner: agnostic/text/match
check: agnostic/context/present
args:
  runner:
    pages: [1]
    pattern: 'Registration Statement Nos\. (?P<registration_no>333-\d{6})'
  check:
    needs: [ingest/ING-document]
output:
  type: object
  properties:
    registration_no: {type: string, pattern: "^333-\\d{6}$"}
  required: [registration_no]
  additionalProperties: false
