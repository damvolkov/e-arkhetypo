kind: semantic
name: INF-risk-class
description: The note's MiFID-style risk class from 1 to 7, with the reasons that hold it there.
pre: owned/classify
check: agnostic/context/present
args:
  check:
    needs: [extract/EXT-terms, extract/EXT-payoff]
tier: high
instructions: >-
  Score this note on the 1-to-7 risk ladder a European distributor would print (SRI-style: 1 lowest, 7
  highest). Weigh: full principal loss below the downside threshold, contingent coupons that can be
  skipped, issuer and guarantor credit, no listing and thin liquidity, and a two-year horizon against
  the index's volatility. Give the class and the three or four deciding reasons, short.
wiki: [downside-threshold, autocall]
timeout: PT3M
output:
  type: object
  properties:
    risk_class: {type: integer, minimum: 1, maximum: 7}
    reasons: {type: array, minItems: 2, maxItems: 5, items: {type: string, minLength: 8, maxLength: 120}}
  required: [risk_class, reasons]
  additionalProperties: false
