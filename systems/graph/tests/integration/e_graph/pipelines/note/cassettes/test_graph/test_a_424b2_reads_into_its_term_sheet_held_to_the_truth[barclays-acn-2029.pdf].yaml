- request:
    body: "{\"model\":\"qwen3.8-flash\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### INF-risk-class\\nThe
      note's MiFID-style risk class from 1 to 7, with the reasons that hold it there.\\nScore
      this note on the 1-to-7 risk ladder a European distributor would print (SRI-style:
      1 lowest, 7 highest). Weigh: full principal loss below the downside threshold,
      contingent coupons that can be skipped, issuer and guarantor credit, no listing
      and thin liquidity, and a two-year horizon against the index's volatility. Give
      the class and the three or four deciding reasons, short.\\nGlossary, downside-threshold:\\n#
      downside-threshold\\n\\nThe level of the underlying below which the investor
      starts losing principal at maturity. When the Final\\nValue is at or above the
      Downside Threshold (and the note was never called), the stated principal is\\nrepaid;
      below it, the payout falls proportionally to the decline of the underlying,
      up to a total loss.\\nIt is usually a percentage (e.g. 75%) of the Initial Value;
      a note whose coupon barrier equals its\\ndownside threshold is \\\"fully at
      risk\\\" below that level.\\nGlossary, autocall:\\n# autocall\\n\\nAn automatic
      call (a \\\"kick-out\\\") ends a structured note early: on an Observation Date
      whose closing level\\nreaches the call threshold \u2014 often the Initial Value
      \u2014 the issuer must redeem the note at par plus the\\ncoupon due, and no
