- request:
    body: "{\"model\":\"qwen3.8-flash\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-market-maker\\nWho
      may make a market in the notes, and whether anyone is obliged to.\\nFrom the
      cover notice and the risk section: the firm expected to act as market-maker
      for the notes (its short printed name, e.g. \\\"BofAS\\\"), whether it or any
      party is required to do so or to buy the notes at any price, and whether the
      notes may have limited or no liquidity \u2014 a yes-or-no.\"},{\"role\":\"user\",\"content\":\"###
      Material for EXT-market-maker\\n## Page 1\\n424B2 1 dp254889\\\\_424b2-9806ubs.htm
      FORM 424B2\\n\\nPricing Supplement dated October 8, 2026 Filed Pursuant to Rule
      424(b)(2) Registration Statement No. 333-287303\\n\\n## $9,172,000 Barclays
      Bank PLC Trigger Autocallable Contingent Yield Notes with Memory Coupon Feature\\n\\n##
      Linked to the Class A ordinary shares of Accenture plc due October 11, 2029\\n\\nInvestment
      Description\\n\\nThe Trigger Autocallable Contingent Yield Notes (the \\\"Notes\\\")
      are unsecured and unsubordinated debt obligations issued by Barclays Bank PLC
      (the \\\"Issuer\\\") linked to the performance of the Class A ordinary shares
      of Accenture plc (the \\\"Underlying\\\"). On a quarterly basis, unless the
      Notes have been previously called, the Issuer will pay you a coupon (the \\\"Contingent
      Coupon\\\"), plus all previously unpaid Contingent Coupons, if any, if the Closing
      Price of the Underlying on the applicable Observation Date is greater than or
      equal to the specified Coupon Barrier. Otherwise, no Contingent Coupon will
      be paid for that quarter. The Issuer will automatically call the Notes if the
      Closing Price of the Underlying on any quarterly Observation Date is greater
      than or equal to the Closing Price of the Underlying on the Trade Date (the
      \\\"Initial Underlying Price\\\"). If the Notes are automatically called, the
      Issuer will pay the principal amount of your Notes plus the Contingent Coupon
      and any previously unpaid Contingent Coupons due on the Coupon Payment Date
      that is also the Call Settlement Date, and no further amounts will be owed to
      you under the Notes. If the Notes are not automatically called and the Closing
      Price of the Underlying on the Final Valuation Date (the \\\"Final Underlying
      Price\\\") is greater than or equal to the specified Downside Threshold (which
      is set equal to the Coupon Barrier), the Issuer will pay you a cash payment
      at maturity equal to the principal amount of your Notes plus the Contingent
      Coupon and any previously unpaid Contingent Coupons due on the Coupon Payment
      Date that is also the Maturity Date. However, if the Notes are not automatically
      called and the Final Underlying Price is less than the Downside Threshold, the
      Issuer will pay you a cash payment at maturity that is less than the principal
      amount, if anything, resulting in a percentage loss of principal equal to the
      negative Underlying Return. In this case, you will have full downside exposure
      to the Underlying from the Initial Underlying Price to the Final Underlying
      Price, and could lose all of your principal. Investing in the Notes involves
      significant risks. You may lose a significant portion or all of your principal.
      You may receive few or no Contingent Coupons during the term of the Notes. The
      Final Underlying Price is observed relative to the Downside Threshold only on
      the Final Valuation Date, and the contingent repayment of principal applies
      only if you hold the Notes to maturity. Generally, the higher the Contingent
      Coupon Rate on a Note, the greater the risk of loss on that Note. Your return
      potential on the Notes is limited to any Contingent Coupons paid on the Notes,
      and you will not participate in any appreciation of the Underlying. Any payment
      on the Notes, including any repayment of principal, is subject to the creditworthiness
      of Barclays Bank PLC and is not guaranteed by any third party. If Barclays Bank
      PLC were to default on its payment obligations or become subject to the exercise
      of any U.K. Bail-in Power (as described on page PS-4 of this pricing supplement)
      by the relevant U.K. resolution authority, you might not receive any amounts
      owed to you under the Notes. See \\\"Consent to U.K. Bail-in Power\\\" in this
      pricing supplement and \\\"Risk Factors\\\" in the accompanying prospectus supplement.\\n\\nFeatures\\n\\n-
      q Contingent Coupon with Memory Coupon Feature: Unless the Notes have been previously
      called, the Issuer will pay you a Contingent Coupon for each quarter, plus all
      previously unpaid Contingent Coupons, if any, if the Closing Price of the Underlying
      on the applicable Observation Date is greater than or equal to the Coupon Barrier.
      Otherwise, no Contingent Coupon will be paid for that quarter.\\n- q Automatic
      Call: The Issuer will automatically call the Notes if the Closing Price of the
      Underlying on any quarterly Observation Date is greater than or equal to the
      Initial Underlying Price. If the Notes are automatically called, the Issuer
      will pay the principal amount of your Notes plus the Contingent Coupon and any
      previously unpaid Contingent Coupons due on the Coupon Payment Date that is
      also the Call Settlement Date, and no further amounts will be owed to you under
      the Notes.\\n- q Downside Exposure with Contingent Repayment of Principal at
      Maturity: If the Notes are not automatically called and the Final Underlying
      Price is greater than or equal to the Downside Threshold, the Issuer will pay
      you a cash payment at maturity equal to the principal amount of your Notes plus
      the Contingent Coupon and any previously unpaid Contingent Coupons due on the
      Coupon Payment Date that is also the Maturity Date. However, if the Notes are
      not automatically called and the Final Underlying Price is less than the Downside
      Threshold, at maturity, the Issuer will repay less than your principal amount,
      if anything, resulting in a percentage loss of principal equal to the negative
      Underlying Return. The Final Underlying Price is observed relative to the\\n-
      1 The Observation Dates, including the Final Valuation Date, and the Maturity
      Date are subject to postponement. See \\\"Final Terms\\\" on page PS-6 of this
      pricing supplement.\\n\\n| Key Dates 1           | Key Dates 1      |\\n|-----------------------|------------------|\\n|
      Trade Date:           | October 8, 2026  |\\n| Settlement Date:      | October
      14, 2026 |\\n| Observation Dates:    | Quarterly        |\\n| Final Valuation
      Date: | October 8, 2029  |\\n| Maturity Date:        | October 11, 2029 |\\n\\n##
      Page 18\\ninstead of other investments. Furthermore, we and our affiliates establish
      the offering price of the Notes for initial sale to the public, and the offering
      price is not based upon any independent verification or valuation. In addition
      to the activities described above, we will also act as the Calculation Agent
      for the Notes. As Calculation Agent, we will determine any values of the Underlying
      and make any other determinations necessary to calculate any payments on the
      Notes. In making these determinations, we may be required to make discretionary
      judgments, including those described in the accompanying prospectus supplement
      and under \\\"-Risks Relating to the Underlying\\\" above. In making these discretionary
      judgments, our economic interests are potentially adverse to your interests
      as an investor in the Notes, and any of these determinations may adversely affect
      any payments on the Notes.\\n\\n## Risks Relating to the Estimated Value of
      the Notes and the Secondary Market\\n\\n\xA8 **There may be little or no secondary
      market for the Notes - The Notes will not be listed on any securities exchange.**\\n\\nBarclays
      Capital Inc. and other affiliates of Barclays Bank PLC intend to make a secondary
      market for the Notes but are not required to do so, and may discontinue any
      such secondary market making at any time, without notice. Even if there is a
      secondary market, it may not provide enough liquidity to allow you to trade
      or sell the Notes easily. Because other dealers are not likely to make a secondary
      market for the Notes, the price at which you may be able to trade your Notes
      is likely to depend on the price, if any, at which Barclays Capital Inc. and
      other affiliates of Barclays Bank PLC are willing to buy the Notes. The Notes
      are not designed to be short-term trading instruments. Accordingly, you should
      be able and willing to hold your Notes to maturity. \xA8 **Many economic and
      market factors will impact the value of the Notes - Structured notes, including
      the Notes, can**\\n\\nbe thought of as securities that combine a debt instrument
      with one or more options or other derivative instruments. As a result, the factors
      that influence the values of debt instruments and options or other derivative
      instruments will also influence the terms and features of the Notes at issuance
      and their value in the secondary market. Accordingly, in addition to the price
      of the Underlying on any day, the value of the Notes will be affected by a number
      of economic and market factors that may either offset or magnify each other,
      including:\\n\\n\xA8 the expected volatility of the Underlying; \xA8 the time
      to maturity of the Notes; \xA8 the dividend rate on the Underlying; \xA8 interest
      and yield rates in the market generally; \xA8 the existence of any Unpaid Contingent
      Coupons; \xA8 supply and demand for the Notes; \xA8 a variety of economic, financial,
      political, regulatory and judicial events; and \xA8 our creditworthiness, including
      actual or anticipated downgrades in our credit ratings. \xA8 **The estimated
      value of your Notes is lower than the initial issue price of your Notes - The
      estimated value of**\\n\\nyour Notes on the Trade Date is lower than the initial
      issue price of your Notes. The difference between the initial issue price of
      your Notes and the estimated value of the Notes is a result of certain factors,
      such as any sales commissions to be paid to Barclays Capital Inc. or another
      affiliate of ours, any selling concessions, discounts, commissions or fees to
      be allowed or paid to non-affiliated intermediaries, the estimated profit that
      we or any of our affiliates expect to earn in connection with structuring the
      Notes, the estimated cost that we may incur in hedging our obligations under
      the Notes, and estimated development and other costs that we may incur in connection
      with the Notes. \xA8 **The estimated value of your Notes might be lower if such
      estimated value were based on the levels at which**\\n\\n**our debt securities
      trade in the secondary market - The estimated value of your Notes on the Trade
      Date is based**\\n\\non a number of variables, including our internal funding
      rates. Our internal funding rates may vary from the levels at which our benchmark
      debt securities trade in the secondary market. As a result of this difference,
      the estimated value referenced above might be lower if such estimated value
      were based on the levels at which our benchmark debt securities trade in the
      secondary market. Also, this difference in funding rate as well as certain factors,
      such as sales commissions, selling concessions, estimated costs and profits
      mentioned below, reduces the economic terms of the Notes to you.\"}],\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"fused\",\"schema\":{\"type\":\"object\",\"title\":\"fused\",\"properties\":{\"EXT-market-maker\":{\"type\":\"object\",\"properties\":{\"market_maker\":{\"type\":\"string\",\"minLength\":2,\"maxLength\":60},\"obligated\":{\"type\":\"boolean\"},\"limited_liquidity\":{\"type\":\"boolean\"}},\"required\":[\"market_maker\",\"obligated\",\"limited_liquidity\"],\"additionalProperties\":false}},\"required\":[\"EXT-market-maker\"],\"additionalProperties\":false},\"strict\":false}}}"
