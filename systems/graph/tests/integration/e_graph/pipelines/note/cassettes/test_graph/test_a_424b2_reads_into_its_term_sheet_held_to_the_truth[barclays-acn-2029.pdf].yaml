      potential application of Section 871(m) to the Notes.\"}],\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"fused\",\"schema\":{\"type\":\"object\",\"title\":\"fused\",\"properties\":{\"EXT-listing\":{\"type\":\"object\",\"properties\":{\"listed\":{\"type\":\"boolean\"}},\"required\":[\"listed\"],\"additionalProperties\":false},\"EXT-risks\":{\"type\":\"object\",\"properties\":{\"max_loss_percent\":{\"type\":\"number\",\"minimum\":1,\"maximum\":100},\"risks\":{\"type\":\"array\",\"minItems\":3,\"maxItems\":3,\"items\":{\"type\":\"string\",\"minLength\":4,\"maxLength\":120}}},\"required\":[\"max_loss_percent\",\"risks\"],\"additionalProperties\":false},\"EXT-tax\":{\"type\":\"object\",\"properties\":{\"position\":{\"type\":\"string\",\"minLength\":20,\"maxLength\":320},\"uncertain\":{\"type\":\"boolean\"},\"withholding_percent\":{\"type\":\"number\",\"minimum\":0,\"maximum\":100}},\"required\":[\"position\",\"uncertain\",\"withholding_percent\"],\"additionalProperties\":false}},\"required\":[\"EXT-listing\",\"EXT-risks\",\"EXT-tax\"],\"additionalProperties\":false},\"strict\":false}}}"
