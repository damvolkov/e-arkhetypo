      called and the Final Underlying Price is less than the Downside Threshold, the
      Issuer will pay you a cash payment at maturity that is less than the principal
      amount, if anything, resulting in a percentage loss of principal equal to the
      negative Underlying Return. In this case, you will have full downside exposure
      to the Underlying from the Initial Underlying Price to the Final Underlying
      Price, and could lose all of your principal. Investing in the Notes involves
      significant risks. You may lose a significant portion or all of your principal.
      You may receive few or no Contingent Coupons during the term of the Notes. The
      Final Underlying Price is observed relative to the Downside Threshold only on
      the Final Valuation Date, and the contingent repayment of principal applies
      only if you hold the Notes to maturity. Generally, the higher the Contingent
      Coupon Rate on a Note, the greater the risk of loss on that Note. Your return
