    body: "{\"model\":\"qwen3.8-flash\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-listing\\nWhether
      the notes trade on an exchange.\\nFrom the cover page: whether the notes are
      or will be listed on any securities exchange \u2014 a plain yes-or-no \u2014
      and the exchange's name only if they are.\\n\\n### EXT-risks\\nThe shape of
      the risk \u2014 how much can be lost, and what else besides market moves can
      cost the holder.\\nFrom the Risk Factors and the cover notice: the worst loss
      the holder can suffer at maturity as a percentage of the investment (a total
      loss is 100), and three short phrases naming the distinct risks \u2014 the issuer's
      and guarantor's credit, the lack of an exchange listing or liquidity, and the
      market risk of the underlying.\\n\\n### EXT-tax\\nHow the issuer intends to
      treat the notes for US federal income tax, and the plain-English warning attached.\\nFrom
      the tax section: the issuer's intended characterization of the notes for US
      federal income tax (one sentence), whether that treatment is described as uncertain,
      and the US federal withholding rate the issuer will apply to Contingent Coupon
      Payments as a per-cent number (30% is 30).\"},{\"role\":\"user\",\"content\":\"###
      Material for EXT-listing, EXT-risks\\n## Page 1\\n424B2 1 dp254889\\\\_424b2-9806ubs.htm
      FORM 424B2\\n\\nPricing Supplement dated October 8, 2026 Filed Pursuant to Rule
      424(b)(2) Registration Statement No. 333-287303\\n\\n## $9,172,000 Barclays
      Bank PLC Trigger Autocallable Contingent Yield Notes with Memory Coupon Feature\\n\\n##
      Linked to the Class A ordinary shares of Accenture plc due October 11, 2029\\n\\nInvestment
      Description\\n\\nThe Trigger Autocallable Contingent Yield Notes (the \\\"Notes\\\")
      are unsecured and unsubordinated debt obligations issued by Barclays Bank PLC
      (the \\\"Issuer\\\") linked to the performance of the Class A ordinary shares
      of Accenture plc (the \\\"Underlying\\\"). On a quarterly basis, unless the
      Notes have been previously called, the Issuer will pay you a coupon (the \\\"Contingent
      Coupon\\\"), plus all previously unpaid Contingent Coupons, if any, if the Closing
      Price of the Underlying on the applicable Observation Date is greater than or
      equal to the specified Coupon Barrier. Otherwise, no Contingent Coupon will
      be paid for that quarter. The Issuer will automatically call the Notes if the
      Closing Price of the Underlying on any quarterly Observation Date is greater
      than or equal to the Closing Price of the Underlying on the Trade Date (the
      \\\"Initial Underlying Price\\\"). If the Notes are automatically called, the
      Issuer will pay the principal amount of your Notes plus the Contingent Coupon
      and any previously unpaid Contingent Coupons due on the Coupon Payment Date
      that is also the Call Settlement Date, and no further amounts will be owed to
      you under the Notes. If the Notes are not automatically called and the Closing
      Price of the Underlying on the Final Valuation Date (the \\\"Final Underlying
      Price\\\") is greater than or equal to the specified Downside Threshold (which
      is set equal to the Coupon Barrier), the Issuer will pay you a cash payment
      at maturity equal to the principal amount of your Notes plus the Contingent
      Coupon and any previously unpaid Contingent Coupons due on the Coupon Payment
      Date that is also the Maturity Date. However, if the Notes are not automatically
      called and the Final Underlying Price is less than the Downside Threshold, the
      Issuer will pay you a cash payment at maturity that is less than the principal
      amount, if anything, resulting in a percentage loss of principal equal to the
      negative Underlying Return. In this case, you will have full downside exposure
      to the Underlying from the Initial Underlying Price to the Final Underlying
      Price, and could lose all of your principal. Investing in the Notes involves
      significant risks. You may lose a significant portion or all of your principal.
      You may receive few or no Contingent Coupons during the term of the Notes. The
      Final Underlying Price is observed relative to the Downside Threshold only on
      the Final Valuation Date, and the contingent repayment of principal applies
      only if you hold the Notes to maturity. Generally, the higher the Contingent
      Coupon Rate on a Note, the greater the risk of loss on that Note. Your return
      potential on the Notes is limited to any Contingent Coupons paid on the Notes,
      and you will not participate in any appreciation of the Underlying. Any payment
      on the Notes, including any repayment of principal, is subject to the creditworthiness
      of Barclays Bank PLC and is not guaranteed by any third party. If Barclays Bank
      PLC were to default on its payment obligations or become subject to the exercise
      of any U.K. Bail-in Power (as described on page PS-4 of this pricing supplement)
      by the relevant U.K. resolution authority, you might not receive any amounts
      owed to you under the Notes. See \\\"Consent to U.K. Bail-in Power\\\" in this
      pricing supplement and \\\"Risk Factors\\\" in the accompanying prospectus supplement.\\n\\nFeatures\\n\\n-
      q Contingent Coupon with Memory Coupon Feature: Unless the Notes have been previously
      called, the Issuer will pay you a Contingent Coupon for each quarter, plus all
      previously unpaid Contingent Coupons, if any, if the Closing Price of the Underlying
      on the applicable Observation Date is greater than or equal to the Coupon Barrier.
      Otherwise, no Contingent Coupon will be paid for that quarter.\\n- q Automatic
      Call: The Issuer will automatically call the Notes if the Closing Price of the
      Underlying on any quarterly Observation Date is greater than or equal to the
      Initial Underlying Price. If the Notes are automatically called, the Issuer
      will pay the principal amount of your Notes plus the Contingent Coupon and any
      previously unpaid Contingent Coupons due on the Coupon Payment Date that is
      also the Call Settlement Date, and no further amounts will be owed to you under
      the Notes.\\n- q Downside Exposure with Contingent Repayment of Principal at
      Maturity: If the Notes are not automatically called and the Final Underlying
      Price is greater than or equal to the Downside Threshold, the Issuer will pay
      you a cash payment at maturity equal to the principal amount of your Notes plus
      the Contingent Coupon and any previously unpaid Contingent Coupons due on the
      Coupon Payment Date that is also the Maturity Date. However, if the Notes are
      not automatically called and the Final Underlying Price is less than the Downside
      Threshold, at maturity, the Issuer will repay less than your principal amount,
      if anything, resulting in a percentage loss of principal equal to the negative
      Underlying Return. The Final Underlying Price is observed relative to the\\n-
      1 The Observation Dates, including the Final Valuation Date, and the Maturity
      Date are subject to postponement. See \\\"Final Terms\\\" on page PS-6 of this
      pricing supplement.\\n\\n| Key Dates 1           | Key Dates 1      |\\n|-----------------------|------------------|\\n|
      Trade Date:           | October 8, 2026  |\\n| Settlement Date:      | October
      14, 2026 |\\n| Observation Dates:    | Quarterly        |\\n| Final Valuation
      Date: | October 8, 2029  |\\n| Maturity Date:        | October 11, 2029 |\\n\\n##
      Page 2\\nDownside Threshold only on the Final Valuation Date, and the contingent
      repayment of principal applies only if you hold the Notes to maturity. Any payment
      on the Notes, including any repayment of principal, is subject to the creditworthiness
      of Barclays Bank PLC.\\n\\nNOTICE TO INVESTORS: THE NOTES ARE SIGNIFICANTLY
      RISKIER THAN CONVENTIONAL DEBT INSTRUMENTS. THE ISSUER IS NOT NECESSARILY OBLIGATED
      TO REPAY THE FULL PRINCIPAL AMOUNT OF THE NOTES AT MATURITY, AND THE NOTES CAN
      HAVE THE FULL DOWNSIDE MARKET RISK OF THE UNDERLYING. THIS MARKET RISK IS IN
      ADDITION TO THE CREDIT RISK INHERENT IN PURCHASING A DEBT OBLIGATION OF BARCLAYS
      BANK PLC. YOU SHOULD NOT PURCHASE THE NOTES IF YOU DO NOT UNDERSTAND OR ARE
      NOT COMFORTABLE WITH THE SIGNIFICANT RISKS INVOLVED IN INVESTING IN THE NOTES.
      YOU SHOULD CAREFULLY CONSIDER THE RISKS DESCRIBED UNDER \\\"KEY RISKS\\\" BEGINNING
      ON PAGE PS-9 OF THIS PRICING SUPPLEMENT AND \\\"RISK FACTORS\\\" BEGINNING ON
      PAGE S-9 OF THE PROSPECTUS SUPPLEMENT BEFORE PURCHASING ANY NOTES. EVENTS RELATING
      TO ANY OF THOSE RISKS, OR OTHER RISKS AND UNCERTAINTIES, COULD ADVERSELY AFFECT
      THE MARKET VALUE OF, AND THE RETURN ON, YOUR NOTES. YOU MAY LOSE A SIGNIFICANT
      PORTION OR ALL OF YOUR PRINCIPAL AMOUNT. THE NOTES WILL NOT BE LISTED ON ANY
      SECURITIES EXCHANGE. NOTWITHSTANDING AND TO THE EXCLUSION OF ANY OTHER TERM
      OF THE NOTES OR ANY OTHER AGREEMENTS, ARRANGEMENTS OR UNDERSTANDINGS BETWEEN
      BARCLAYS BANK PLC AND ANY HOLDER OR BENEFICIAL OWNER OF THE NOTES (OR THE TRUSTEE
      ON BEHALF OF THE HOLDERS OF THE NOTES), BY ACQUIRING THE NOTES, EACH HOLDER
      OR BENEFICIAL OWNER OF THE NOTES ACKNOWLEDGES, ACCEPTS, AGREES TO BE BOUND BY,
      AND CONSENTS TO THE EXERCISE OF, ANY U.K. BAIL-IN POWER BY THE RELEVANT U.K.
      RESOLUTION AUTHORITY. SEE \\\"CONSENT TO U.K. BAIL-IN POWER\\\" ON PAGE PS-4
      OF THIS PRICING SUPPLEMENT.\\n\\nNote Offering\\n\\nWe are offering Trigger
      Autocallable Contingent Yield Notes linked to the Class A ordinary shares of
      Accenture plc. The Notes are offered at a minimum investment of 100 Notes at
      $10 per Note (representing a $1,000 investment), and integral multiples of $10
      in excess thereof.\\n\\n| Underlying                                     | Contingent
      Coupon Rate   | Initial Underlying Price*   | Coupon Barrier**                                         |
      Downside Threshold**                                     | CUSIP / ISIN             |\\n|------------------------------------------------|--------------------------|-----------------------------|----------------------------------------------------------|----------------------------------------------------------|--------------------------|\\n|
      Class A ordinary shares of Accenture plc (ACN) | 15.01% per annum         |
      $208.36                     | $125.02, which is 60.00% of the Initial Underlying
      Price | $125.02, which is 60.00% of the Initial Underlying Price | 06749E557
      / US06749E5574 |\\n\\n* The Initial Underlying Price is the Closing Price of
      the Underlying on the Trade Date.\\n\\n** Rounded to two decimal places\\n\\nSee
      \\\"Additional Information about Barclays Bank PLC and the Notes\\\" on page
      PS-2 of this pricing supplement. The Notes will have the terms specified in
      the prospectus dated May 15, 2025, the prospectus supplement dated May 15, 2025
      and this pricing supplement. Neither the U.S. Securities and Exchange Commission
      (the \\\"SEC\\\") nor any state securities commission has approved or disapproved
      of the Notes or determined that this pricing supplement is truthful or complete.
      Any representation to the contrary is a criminal offense. We may use this pricing
      supplement in the initial sale of the Notes. In addition, Barclays Capital Inc.
      or any other of our affiliates may use this pricing supplement in market resale
      transactions in any of the Notes after their initial sale. Unless we or our
      agent informs you otherwise in the confirmation of sale, this pricing supplement
      is being used in a market resale transaction. The Notes constitute our unsecured
      and unsubordinated obligations. The Notes are not deposit liabilities of Barclays
      Bank PLC and are not covered by the U.K. Financial Services Compensation Scheme
      or insured by the U.S. Federal Deposit Insurance Corporation or any other governmental
      agency or deposit insurance agency of the United States, the United Kingdom
      or any other jurisdiction.\\n\\n## Initial Issue Price 1 Underwriting Discount
      Proceeds to Barclays Bank PLC\\n\\n1 Our estimated value of the Notes on the
      Trade Date, based on our internal pricing models, is $9.677 per Note. The estimated
      value is less than the initial issue price of the Notes. See \\\"Additional
      Information Regarding Our Estimated Value of the Notes\\\" on page PS-3 of this
      pricing supplement.\\n\\n| Per Note   | $10.00     | $0.225   | $9.775     |\\n|------------|------------|----------|------------|\\n|
      Total      | $9,172,000 | $206,370 | $8,965,630 |\\n\\nUBS Financial Services
      Inc. Barclays Capital Inc.\\n\\n### Material for EXT-tax\\n## Page 24\\n## What
      Are the Tax Consequences of an Investment in the Notes?\\n\\nYou should review
      carefully the sections in the accompanying prospectus supplement entitled \\\"Material
      U.S. Federal Income Tax Consequences-Tax Consequences to U.S. Holders-Notes
      Treated as Prepaid Forward or Derivative Contracts with Associated Coupons\\\"
      and, if you are a non-U.S. holder, \\\"-Tax Consequences to Non-U.S. Holders.\\\"
      The following discussion supersedes the discussion in the accompanying prospectus
      supplement to the extent it is inconsistent therewith.\\n\\nIn determining our
      reporting responsibilities, if any, we intend to treat (i) the Notes for U.S.
      federal income tax purposes as prepaid forward contracts with associated contingent
      coupons and (ii) any Contingent Coupons as ordinary income, as described in
      the section entitled \\\"Material U.S. Federal Income Tax Consequences-Tax Consequences
      to U.S. HoldersNotes Treated as Prepaid Forward or Derivative Contracts with
      Associated Coupons\\\" in the accompanying prospectus supplement. Our special
      tax counsel, Davis Polk &amp; Wardwell LLP, has advised that it believes this
      treatment to be reasonable, but that there are other reasonable treatments that
      the Internal Revenue Service (the \\\"IRS\\\") or a court may adopt.\\n\\nSale,
      exchange or redemption of a Note. Assuming the treatment described above is
      respected, upon a sale or exchange of the Notes (including upon early redemption
      or redemption at maturity), you should recognize capital gain or loss equal
      to the difference between the amount realized on the sale or exchange and your
      tax basis in the Notes, which should equal the amount you paid to acquire the
      Notes (assuming Contingent Coupons are properly treated as ordinary income,
      consistent with the position referred to above). This gain or loss should be
      short-term capital gain or loss unless you hold the Notes for more than one
      year, in which case the gain or loss should be long-term capital gain or loss,
      whether or not you are an initial purchaser of the Notes at the issue price.
      The deductibility of capital losses is subject to limitations. If you sell your
      Notes between the time your right to a Contingent Coupon is fixed and the time
      it is paid, it is likely that you will be treated as receiving ordinary income
      equal to the Contingent Coupon. Although uncertain, it is possible that proceeds
      received from the sale or exchange of your Notes prior to an Observation Date
      but that can be attributed to an expected Contingent Coupon payment could be
      treated as ordinary income. You should consult your tax advisor regarding this
      issue.\\n\\nAs noted above, there are other reasonable treatments that the IRS
      or a court may adopt, in which case the timing and character of any income or
      loss on the Notes could be materially affected. In addition, in 2007 the U.S.
      Treasury Department and the IRS released a notice requesting comments on the
      U.S. federal income tax treatment of \\\"prepaid forward contracts\\\" and similar
      instruments. The notice focuses in particular on whether to require investors
      in these instruments to accrue income over the term of their investment. It
      also asks for comments on a number of related topics, including the character
      of income or loss with respect to these instruments and the relevance of factors
      such as the nature of the underlying property to which the instruments are linked.
      While the notice requests comments on appropriate transition rules and effective
      dates, any Treasury regulations or other guidance promulgated after consideration
      of these issues could materially affect the tax consequences of an investment
      in the Notes, possibly with retroactive effect. You should consult your tax
      advisor regarding the U.S. federal income tax consequences of an investment
      in the Notes, including possible alternative treatments and the issues presented
      by this notice.\\n\\nNon-U.S. holders. Insofar as we have responsibility as
      a withholding agent, we do not currently intend to treat Contingent Coupon payments
      to non-U.S. holders as subject to U.S. withholding tax. However, non-U.S. holders
      should in any event expect to be required to provide appropriate Forms W-8 or
      other documentation in order to establish an exemption from backup withholding,
      as described under the heading \\\"-Information Reporting and Backup Withholding\\\"
      in the accompanying prospectus supplement. If any withholding is required, we
      will not be required to pay any additional amounts with respect to amounts withheld.\\n\\nTreasury
      regulations under Section 871(m) generally impose a withholding tax on certain
      \\\"dividend equivalents\\\" under certain \\\"equity linked instruments.\\\"
      A recent IRS notice excludes from the scope of Section 871(m) instruments issued
      prior to January 1, 2029 that do not have a \\\"delta of one\\\" with respect
      to underlying securities that could pay U.S.-source dividends for U.S. federal
      income tax purposes (each an \\\"Underlying Security\\\"). Based on our determination
      that the Notes do not have a \\\"delta of one\\\" within the meaning of the
      regulations, our special tax counsel is of the opinion that these regulations
      should not apply to the Notes with regard to non-U.S. holders. Our determination
      is not binding on the IRS, and the IRS may disagree with this determination.
      Section 871(m) is complex and its application may depend on your particular
      circumstances, including whether you enter into other transactions with respect
