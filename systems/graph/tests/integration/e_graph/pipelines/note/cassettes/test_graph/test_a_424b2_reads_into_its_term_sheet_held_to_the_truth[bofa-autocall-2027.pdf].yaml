      and tax treatment described in this pricing supplement. Accordingly, you are
      urged to consult your tax advisor regarding all aspects* *of the U.S. federal
      income tax consequences of an investment in the Notes, including possible alternative
      characterizations.* Unless otherwise stated, the following discussion is based
      on the characterization described above. The discussion in this section assumes
      that there is a significant possibility of a significant loss of principal on
      an investment in the Notes. We will not attempt to ascertain whether the issuer
      of any component stocks included in the Underlying would be treated as a \"passive
      foreign investment company\" (\"PFIC\"), within the meaning of Section 1297
      of the Code, or a United States real property holding corporation, within the
      meaning of Section 897(c) of the Code. If the issuer of one or more stocks included
      in the Underlying were so treated, certain adverse U.S. federal income tax consequences
      could possibly apply to a holder of the Notes. You should refer to information
      filed with the SEC by the issuers of the component stocks included in the Underlying
      and consult your tax advisor regarding the possible consequences to you, if
      any, if any issuer of a component stock included in the Underlying is or becomes
      a PFIC or is or becomes a United States real property holding corporation.\n\n##
      U.S. Holders\n\nAlthough the U.S. federal income tax treatment of any Contingent
      Coupon Payment on the Notes is uncertain, we intend to take the position, and
      the following discussion assumes, that any Contingent Coupon Payment constitutes
      taxable ordinary income to a U.S. Holder at the time received or accrued in
      accordance with the U.S. Holder''s regular method of accounting. By purchasing
      the Notes you agree, in the absence of an administrative determination or judicial
      ruling to the contrary, to treat any Contingent Coupon Payment as described
      in the preceding sentence. Upon receipt of a cash payment at maturity or upon
      a sale, exchange, or redemption of the Notes prior to maturity, a U.S. Holder
      generally will recognize capital gain or loss equal to the difference between
      the amount realized (other than amounts representing any Contingent Coupon Payment,
      which would be taxed as described above) and the U.S. Holder''s tax basis in
