- request:
    body: "{\"model\":\"qwen3.8-flash\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-barrier\\nThe
      two protective levels \u2014 the Coupon Barrier and the Downside Threshold \u2014
      and their share of the Initial Value.\\nFrom the cover page: the Coupon Barrier
      as a printed number, the Downside Threshold as a printed number, and what share
      of the Initial Value they represent as a percentage number (75% of the Initial
      Value is 75). If the two levels are equal, give the same number twice.\\nGlossary,
      downside-threshold:\\n# downside-threshold\\n\\nThe level of the underlying
      below which the investor starts losing principal at maturity. When the Final\\nValue
      is at or above the Downside Threshold (and the note was never called), the stated
      principal is\\nrepaid; below it, the payout falls proportionally to the decline
      of the underlying, up to a total loss.\\nIt is usually a percentage (e.g. 75%)
      of the Initial Value; a note whose coupon barrier equals its\\ndownside threshold
      is \\\"fully at risk\\\" below that level.\\n\\n### EXT-estimated-value\\nWhat
      the issuer estimates the note is worth on the pricing date, per $10 of principal.\\nFrom
      the cover page, the initial estimated value of the notes as of the Trade Date,
      stated in dollars per $10 of Stated Principal Amount (\\\"$9.938 per $10 in
      Stated Principal Amount\\\" is 9.938), and the public offering price per note
      in dollars as printed in the offering table.\\nGlossary, estimated-value:\\n#
      estimated-value\\n\\nThe issuer's own estimate of what the note is worth to
      an investor as of the pricing date, computed\\nwithout any distribution charges
      \u2014 the price at which the note would change hands between professionals.\\nIt
      is always stated against the issue price (e.g. dollars per $10 of stated principal)
      and is lower than\\nthe public offering price: the gap is the fee drag of underwriting,
      structuring and hedging. It is not a\\nguarantee, nor a minimum resale price.\"},{\"role\":\"user\",\"content\":\"###
      Material for EXT-barrier, EXT-estimated-value\\n## Page 1\\n## 424B2 1 form424b2.htm
      424B2\\n\\nPricing Supplement (To Prospectus dated December 30, 2022, Prospectus
      Supplement dated December 30, 2022 and Product Supplement EQUITY-1 dated December
      30, 2022) November 6, 2025\\n\\n## BofA Finance LLC $6,484,400 Trigger Autocallable
      Contingent Yield Notes\\n\\nLinked to the S&amp;P 500 \xAE Index Due November
