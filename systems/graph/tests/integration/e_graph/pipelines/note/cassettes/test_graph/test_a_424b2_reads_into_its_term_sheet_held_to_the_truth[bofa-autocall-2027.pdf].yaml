      as otherwise specifically noted, will purchase the Notes upon original issuance
      and will hold the Notes as capital assets within the meaning of Section 1221
      of the Code, which generally means property held for investment, and that are
      not excluded from the discussion under \"U.S. Federal Income Tax Considerations\"
      in the accompanying prospectus. *You should consult your own tax advisor concerning
      the U.S. federal income tax consequences to you of acquiring, owning, and disposing
      of the* *Notes, as well as any tax consequences arising under the laws of any
      state, local, foreign, or other tax jurisdiction and the possible effects of
      changes* *in U.S. federal or other tax laws.*\n\n## General\n\nAlthough there
      is no statutory, judicial, or administrative authority directly addressing the
      characterization of the Notes, we intend to treat the Notes for all tax purposes
      as contingent income-bearing single financial contracts with respect to the
      Underlying and under the terms of the Notes, we and every investor in the Notes
      agree, in the absence of an administrative determination or judicial ruling
      to the contrary, to treat the Notes in accordance with such characterization.
      In the opinion of our counsel, Sidley Austin LLP, it is reasonable to treat
      the Notes as contingent income-bearing single financial contracts with respect
      to the Underlying. This discussion assumes that the Notes constitute contingent
      income-bearing single financial contracts with respect to the Underlying for
      U.S. federal income tax purposes. If the Notes did not constitute contingent
      income-bearing single financial contracts, the tax consequences described below
      would be materially different. *This characterization of the Notes is not binding
      on the IRS or the courts. No statutory, judicial, or administrative authority
      directly addresses the* *characterization of the Notes or any similar instruments
