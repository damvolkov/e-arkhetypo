- request:
    body: "{\"model\":\"qwen3.8-flash\",\"messages\":[{\"role\":\"system\",\"content\":\"You
      answer several specifications at once. Each one is introduced below by its name
      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-market-maker\\nWho
      may make a market in the notes, and whether anyone is obliged to.\\nFrom the
      cover notice and the risk section: the firm expected to act as market-maker
      for the notes (its short printed name, e.g. \\\"BofAS\\\"), whether it or any
      party is required to do so or to buy the notes at any price, and whether the
      notes may have limited or no liquidity \u2014 a yes-or-no.\"},{\"role\":\"user\",\"content\":\"###
      Material for EXT-market-maker\\n## Page 1\\n## 424B2 1 form424b2.htm 424B2\\n\\nPricing
      Supplement (To Prospectus dated December 30, 2022, Prospectus Supplement dated
      December 30, 2022 and Product Supplement EQUITY-1 dated December 30, 2022) November
      6, 2025\\n\\n## BofA Finance LLC $6,484,400 Trigger Autocallable Contingent
      Yield Notes\\n\\nLinked to the S&amp;P 500 \xAE Index Due November 12, 2027\\n\\nFully
      and Unconditionally Guaranteed by Bank of America Corporation\\n\\n## Investment
      Description\\n\\nThe Trigger Autocallable Contingent Yield Notes (the \\\"Notes\\\")
      linked to the S&amp;P 500 \xAE Index (the \\\"Underlying\\\") are senior unsecured
      obligations issued by BofA Finance LLC (\\\"BofA Finance\\\"), a direct, wholly-owned
      subsidiary of Bank of America Corporation (\\\"BAC\\\" or the \\\"Guarantor\\\"),
      which are fully and unconditionally guaranteed by the Guarantor. The Notes will
      pay a Contingent Coupon Payment on each quarterly Coupon Payment Date if, and
      only if, the Current Underlying Level on the related quarterly Observation Date
      is greater than or equal to the Coupon Barrier. If the Current Underlying Level
      on the applicable quarterly Observation Date is less than the Coupon Barrier,
      no Contingent Coupon Payment will accrue or be paid on the related Coupon Payment
      Date. Beginning approximately three months after issuance, if the Current Underlying
      Level on the applicable quarterly Observation Date (other than the Final Observation
      Date) is greater than or equal to the Initial Value, we will automatically call
      the Notes and pay you the Stated Principal Amount plus the Contingent Coupon
      Payment for that Observation Date, and no further amounts will be owed to you.
      If the Notes have not previously been automatically called, at maturity, the
      amount you receive will depend on the Final Value on the Final Observation Date.
      If the Final Value on the Final Observation Date is greater than or equal to
      the Downside Threshold, you will receive the Stated Principal Amount at maturity
      (plus the final Contingent Coupon Payment). However, if the Notes have not been
      automatically called prior to maturity and the Final Value on the Final Observation
      Date is less than the Downside Threshold, you will receive less than the Stated
      Principal Amount at maturity, resulting in a loss that is proportionate to the
      decline in the closing level of the Underlying from the Trade Date to the Final
      Observation Date, up to a 100% loss of your investment. Investing in the Notes
      involves significant risks. You may lose a substantial portion or all of your
      initial investment. All payments on the Notes will be based solely on the performance
      of the Underlying. You will not receive dividends or other distributions paid
      on any stocks included in the Underlying or participate in any appreciation
      of the Underlying. The contingent repayment of the Stated Principal Amount applies
      only if you hold the Notes to maturity or earlier automatic call. Any payment
      on the Notes, including any repayment of the Stated Principal Amount, is subject
      to the creditworthiness of BofA Finance and the Guarantor and is not, either
      directly or indirectly, an obligation of any third party.\\n\\n## Features\\n\\nFiled
      Pursuant to Rule 424(b)(2) Series A Registration Statement Nos. 333-268718 and
      333-268718-01\\n\\n<!-- image -->\\n\\n## Key Dates\\n\\n- [ ] \u2751 Contingent
      Coupon Payment - We will pay you a Contingent Coupon Payment on each quarterly
      Coupon Payment Date if, and only if, the Current Underlying Level on the related
      Observation Date is greater than or equal to the Coupon Barrier. Otherwise,
      no Contingent Coupon Payment will be paid for that quarter.\\n\\n- [ ] \u2751
      Automatic Call - Beginning approximately three months after issuance, we will
      automatically call the Notes and pay you the Stated Principal Amount plus the
      final Contingent Coupon Payment if the Current Underlying Level on the applicable
      quarterly Observation Date (other than the Final Observation Date) is greater
      than or equal to the Initial Value. If the Notes are not automatically called,
      investors will have full downside market exposure to the Underlying at maturity.\\n\\n-
      [ ] \u2751 Downside Exposure with Contingent Repayment of Principal at Maturity
      - If the Notes are not automatically called prior to maturity and the Final
      Value on the Final Observation Date is greater than or equal to the Downside
      Threshold, you will receive the Stated Principal Amount at maturity (plus the
      final Contingent Coupon Payment). However, if the Final Value on the Final Observation
      Date is less than the Downside Threshold, you will receive less than the Stated
      Principal Amount of your Notes at maturity, resulting in a loss that is proportionate
      to the decline in the closing level of the Underlying from the Trade Date to
      the Final Observation Date, up to a 100% loss of your investment. Any payment
      on the Notes is subject to the creditworthiness of BofA Finance and the Guarantor.\\n\\nTrade
      Date 1\\n\\nIssue Date 1\\n\\nObservation Dates 2\\n\\nFinal Observation Date
      2 Maturity Date November 6, 2025 November 12, 2025 Quarterly, beginning on February
      6, 2026 (See page PS-6)\\n\\nNovember 8, 2027\\n\\nNovember 12, 2027\\n\\n-
      1 See \\\"Supplement to the Plan of Distribution; Role of BofAS and Conflicts
      of Interest\\\" in this pricing supplement for additional information.\\n- 2
      See page PS-6 for additional details.\\n\\nNOTICE TO INVESTORS: THE NOTES ARE
      SIGNIFICANTLY RISKIER THAN CONVENTIONAL DEBT INSTRUMENTS. BOFA FINANCE IS NOT
      NECESSARILY OBLIGATED TO REPAY THE STATED PRINCIPAL AMOUNT AT MATURITY, AND
      THE NOTES CAN HAVE DOWNSIDE MARKET RISK SIMILAR TO THE UNDERLYING. THIS MARKET
      RISK IS IN ADDITION TO THE CREDIT RISK INHERENT IN PURCHASING A DEBT OBLIGATION
      OF BOFA FINANCE THAT IS GUARANTEED BY BAC. YOU SHOULD NOT PURCHASE THE NOTES
      IF YOU DO NOT UNDERSTAND OR ARE NOT COMFORTABLE WITH THE SIGNIFICANT RISKS INVOLVED
      IN INVESTING IN THE NOTES.\\n\\nYOU SHOULD CAREFULLY CONSIDER THE RISKS DESCRIBED
      UNDER 'RISK FACTORS'' BEGINNING ON PAGE PS-7 OF THIS PRICING SUPPLEMENT, PAGE
      PS-5 OF THE ACCOMPANYING PRODUCT SUPPLEMENT, PAGE S-6 OF THE ACCOMPANYING PROSPECTUS
      SUPPLEMENT AND PAGE 7 OF THE ACCOMPANYING PROSPECTUS BEFORE PURCHASING ANY NOTES.
      EVENTS RELATING TO ANY OF THOSE RISKS, OR OTHER RISKS AND UNCERTAINTIES, COULD
      ADVERSELY AFFECT THE MARKET VALUE OF, AND THE RETURN ON, YOUR NOTES. YOU MAY
      LOSE SOME OR ALL OF YOUR INITIAL INVESTMENT IN THE NOTES. THE NOTES WILL NOT
      BE LISTED ON ANY SECURITIES EXCHANGE AND MAY HAVE LIMITED OR NO LIQUIDITY.\\n\\n##
      Notes Offering\\n\\nWe are offering Trigger Autocallable Contingent Yield Notes
      linked to the S&amp;P 500 \xAE Index. Any payment on the Notes will be based
      on the performance of the Underlying. The Notes are our senior unsecured obligations,
      guaranteed by BAC, and are offered for a minimum investment of 100 Notes (each
      Note corresponding to $10.00 in Stated Principal Amount) at the Public Offering
      Price described below.\\n\\nUnderlying\\n\\nS&amp;P 500 \xAE Index (Ticker:
      SPX)\\n\\nContingent Coupon Rate\\n\\n9.60% per annum Initial Value\\n\\n6,720.32\\n\\nSee
      \\\"Summary\\\" in this pricing supplement. The Notes will have the terms specified
      in the accompanying product supplement, prospectus supplement and prospectus,
      as supplemented by this pricing supplement.\\n\\n5,040.24, which is 75% of the
      Initial Value\\n\\n----5,040.24, which is 75% of the Initial Value CUSIP/ ISIN
      09711E688 / US09711E6885\\n\\nNone of the Securities and Exchange Commission
      (the \\\"SEC\\\"), any state securities commission, or any other regulatory
      body has approved or disapproved of these Notes or the guarantee, or passed
      upon the adequacy or accuracy of this pricing supplement, or the accompanying
      product supplement, prospectus supplement or prospectus. Any representation
      to the contrary is a criminal offense. The Notes and the related guarantee of
      the Notes by the Guarantor are unsecured and are not savings accounts, deposits,
      or other obligations of a bank. The Notes are not guaranteed by Bank of America,
      N.A. or any other bank, are not insured by the Federal Deposit Insurance Corporation
      or any other governmental agency and involve investment risks.\\n\\n|          |
      Public Offering Price   | Underwriting Discount   | Proceeds (before expenses)
      to BofA Finance   |\\n|----------|-------------------------|-------------------------|----------------------------------------------|\\n|
      Per Note | $10.00                  | $0.00                   | $10.00                                       |\\n|
      Total    | $6,484,400.00           | $0.00                   | $6,484,400.00
      \                               |\\n\\nUnderwriting Discount (1)\\n\\n(1) The
      underwriting discount is $0.00 per Note. BofA Securities, Inc. (\\\"BofAS\\\"),
      acting as principal, has agreed to purchase from BofA Finance, and BofA Finance
      has agreed to sell to BofAS, the aggregate principal amount of the Notes set
      forth above for $10.00 per Note. UBS Financial Services Inc. (\\\"UBS\\\"),
      acting as a selling agent for sales of the Notes, has agreed to purchase from
      BofAS, and BofAS has agreed to sell to UBS, all of the Notes for $10.00 per
      Note. UBS proposes to offer the Notes to certain fee-based advisory accounts
      for which UBS is also an investment advisor at a price of $10.00 per Note. UBS
      will receive no underwriting discount for each Note that it sells in this offering.
      For additional information on the distribution of the Notes, see \\\"Supplement
      to the Plan of Distribution; Role of BofAS and Conflicts of Interest\\\" in
      this pricing supplement.\\n\\nThe initial estimated value of the Notes is less
      than the public offering price. The initial estimated value of the Notes as
      of the Trade Date is $9.938 per $10 in Stated Principal Amount. See \\\"Summary\\\"
      on page PS-4 of this pricing supplement, \\\"Risk Factors\\\" beginning on page
      PS-7 of this pricing supplement and \\\"Structuring the Notes\\\" on page PS-19
      of this pricing supplement for additional information. The actual value of your
      Notes at any time will reflect many factors and cannot be predicted with accuracy.\\n\\n##
      UBS Financial Services Inc.\\n\\nBofA Securities\\n\\nCoupon Barrier Downside
      Threshold\\n\\n## Page 8\\nsecurities. Any payment on the Notes will be fully
      and unconditionally guaranteed by the Guarantor. The Notes are not guaranteed
      by any entity other than the Guarantor. As a result, your receipt of all payments
      on the Notes will be dependent upon our ability and the ability of the Guarantor
      to repay our respective obligations under the Notes on the applicable payment
      date, regardless of the Current Underlying Level or Final Value, as applicable,
      as compared to the Coupon Barrier, Downside Threshold or Initial Value, as applicable.
      No assurance can be given as to what our financial condition or the financial
      condition of the Guarantor will be on the Maturity Date. If we and the Guarantor
      become unable to meet our respective financial obligations as they become due,
      you may not receive the amounts payable under the terms of the Notes and you
      could lose all of your initial investment.\\n\\nIn addition, our credit ratings
      and the credit ratings of the Guarantor are assessments by ratings agencies
      of our respective abilities to pay our obligations. Consequently, our or the
      Guarantor's perceived creditworthiness and actual or anticipated decreases in
      our or the Guarantor's credit ratings or increases in the spread between the
      yield on our respective securities and the yield on U.S. Treasury securities
      (the \\\"credit spread\\\") prior to the Maturity Date may adversely affect
      the market value of the Notes. However, because your return on the Notes depends
      upon factors in addition to our ability and the ability of the Guarantor to
      pay our respective obligations, such as the value of the Underlying, an improvement
      in our or the Guarantor's credit ratings will not reduce the other investment
      risks related to the Notes.\\n\\n- \u2666 We are a finance subsidiary and, as
      such, have no independent assets, operations or revenues. We are a finance subsidiary
      of BAC, have no operations other than those related to the issuance, administration
      and repayment of our debt securities that are guaranteed by the Guarantor, and
      are dependent upon the Guarantor and/or its other subsidiaries to meet our obligations
      under the Notes in the ordinary course.\\n\\n## Valuation- and Market-related
      Risks\\n\\n- \u2666 The public offering price you are paying for the Notes exceeds
      their initial estimated value. The initial estimated value of the Notes that
      is provided on the cover page of this pricing supplement is an estimate only,
      determined as of the Trade Date by reference to our and our affiliates' pricing
      models. These pricing models consider certain assumptions and variables, including
      our credit spreads and those of the Guarantor, the Guarantor's internal funding
      rate, mid-market terms on hedging transactions, expectations on interest rates,
      dividends and volatility, pricesensitivity analysis, and the expected term of
      the Notes. These pricing models rely in part on certain forecasts about future
      events, which may prove to be incorrect. If you attempt to sell the Notes prior
      to maturity, their market value may be lower than the price you paid for them
      and lower than their initial estimated value. This is due to, among other things,
      changes in the level of the Underlying, changes in the Guarantor's internal
      funding rate, and the inclusion in the public offering price of the underwriting
      discount and the hedging related charges, all as further described in \\\"Structuring
      the Notes\\\" below. These factors, together with various credit, market and
      economic factors over the term of the Notes, are expected to reduce the price
      at which you may be able to sell the Notes in any secondary market and will
      affect the value of the Notes in complex and unpredictable ways.\\n- \u2666
      The initial estimated value does not represent a minimum or maximum price at
      which we, BAC, BofAS or any of our other affiliates would be willing to purchase
      your Notes in any secondary market (if any exists) at any time. The value of
      your Notes at any time after issuance will vary based on many factors that cannot
      be predicted with accuracy, including the performance of the Underlying, our
      and BAC's creditworthiness and changes in market conditions.\\n- \u2666 The
      price of the Notes that may be paid by BofAS in any secondary market (if BofAS
      makes a market, which it is not required to do), as well as the price which
      may be reflected on customer account statements, will be higher than the then-current
      estimated value of the Notes for a limited time period after the Trade Date.
      As agreed by BofAS and UBS, for approximately a three-month period after the
      Trade Date, to the extent BofAS offers to buy the Notes in the secondary market,
      it will do so at a price that will exceed the estimated value of the Notes at
      that time. The amount of this excess, which represents a portion of the hedging-related
      charges expected to be realized by BofAS and UBS over the term of the Notes,
      will decline to zero on a straight line basis over that three-month period.
      Accordingly, the estimated value of your Notes during this initial three-month
      period may be lower than the value shown on your customer account statements.
      Thereafter, if BofAS buys or sells your Notes, it will do so at prices that
      reflect the estimated value determined by reference to its pricing models at
      that time. Any price at any time after the Trade Date will be based on then-prevailing
      market conditions and other considerations, including the performance of the
      Underlying and the remaining term of the Notes. However, none of us, the Guarantor,
      BofAS or any other party is obligated to purchase your Notes at any price or
      at any time, and we cannot assure you that any party will purchase your Notes
      at a price that equals or exceeds the initial estimated value of the Notes.\\n-
      \u2666 We cannot assure you that a trading market for your Notes will ever develop
      or be maintained. We will not list the Notes on any securities exchange. We
      cannot predict how the Notes will trade in any secondary market or whether that
      market will be liquid or illiquid.\\n\\nThe development of a trading market
      for the Notes will depend on the Guarantor's financial performance and other
      factors, including changes in the levels of the Underlying. The number of potential
      buyers of your Notes in any secondary market may be limited. We anticipate that
      BofAS will act as a market-maker for the Notes, but none of us, the Guarantor
      or BofAS is required to do so. There is no assurance that any party will be
      willing to purchase your Notes at any price in any secondary market. BofAS may
      discontinue its market-making activities as to the Notes at any time. To the
      extent that BofAS engages in any market-making activities, it may bid for or
      offer the Notes. Any price at which BofAS may bid for, offer, purchase, or sell
      any Notes may differ from the values determined by pricing models that it may
      use, whether as a result of dealer discounts, mark-ups, or other transaction
      costs. These bids, offers, or completed transactions may affect the prices,
      if any, at which the Notes might otherwise trade in the market. In addition,
      if at any time BofAS were to cease acting as a market-maker as to the Notes,
      it is likely that there would be significantly less liquidity in the secondary
      market. In such a case, the price at which the Notes could be sold likely would
      be lower than if an active market existed.\"}],\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"fused\",\"schema\":{\"type\":\"object\",\"title\":\"fused\",\"properties\":{\"EXT-market-maker\":{\"type\":\"object\",\"properties\":{\"market_maker\":{\"type\":\"string\",\"minLength\":2,\"maxLength\":60},\"obligated\":{\"type\":\"boolean\"},\"limited_liquidity\":{\"type\":\"boolean\"}},\"required\":[\"market_maker\",\"obligated\",\"limited_liquidity\"],\"additionalProperties\":false}},\"required\":[\"EXT-market-maker\"],\"additionalProperties\":false},\"strict\":false}}}"
