      as a heading, with what it asks. Reply with one JSON object holding one key
      per specification name; each value is that specification's answer, shaped exactly
      as its schema says. Answer from the material given.\\n\\n### EXT-payoff\\nThe
      full payment logic of the note \u2014 coupons, the automatic call and the three
      maturity outcomes \u2014 as the document states it.\\nFrom the Investment Description
      on the cover page, state the payment rules of the note, one sentence of at most
      twenty-five words each, naming the amounts as printed: (1) when a quarterly
      Observation Date closes at or above the Coupon Barrier but below the call level,
      (2) when the notes are automatically called, (3) at maturity without a prior
      call and the Final Value is at or above the Downside Threshold, (4) at maturity
      below the Downside Threshold, and (5) the formula for the loss.\\nGlossary,
      contingent-coupon:\\n# contingent-coupon\\n\\nA Contingent Coupon is a periodic
      interest payment on a structured note that is due **only if** the\\nunderlying
      closes at or above a stated Coupon Barrier on the related Observation Date.
      When the level is\\nbelow the barrier, no coupon accrues or is paid for that
      period \u2014 it is lost, not deferred. On quarterly\\nnotes the per-note amount
      is the annual rate divided by four, times the stated principal per note.\\nGlossary,
      autocall:\\n# autocall\\n\\nAn automatic call (a \\\"kick-out\\\") ends a structured
      note early: on an Observation Date whose closing level\\nreaches the call threshold
      \u2014 often the Initial Value \u2014 the issuer must redeem the note at par
      plus the\\ncoupon due, and no further amounts are owed. An autocallable is typically
      not callable on the first\\nobservation dates nor on the final one; the ladder
      of potential call dates and their payouts follows the\\nObservation schedule.\\nGlossary,
      downside-threshold:\\n# downside-threshold\\n\\nThe level of the underlying
      below which the investor starts losing principal at maturity. When the Final\\nValue
      is at or above the Downside Threshold (and the note was never called), the stated
      principal is\\nrepaid; below it, the payout falls proportionally to the decline
      of the underlying, up to a total loss.\\nIt is usually a percentage (e.g. 75%)
      of the Initial Value; a note whose coupon barrier equals its\\ndownside threshold
      is \\\"fully at risk\\\" below that level.\"},{\"role\":\"user\",\"content\":\"###
      Material for EXT-payoff\\n## Page 1\\n## 424B2 1 form424b2.htm 424B2\\n\\nPricing
      Supplement (To Prospectus dated December 30, 2022, Prospectus Supplement dated
      December 30, 2022 and Product Supplement EQUITY-1 dated December 30, 2022) November
      6, 2025\\n\\n## BofA Finance LLC $6,484,400 Trigger Autocallable Contingent
      Yield Notes\\n\\nLinked to the S&amp;P 500 \xAE Index Due November 12, 2027\\n\\nFully
      and Unconditionally Guaranteed by Bank of America Corporation\\n\\n## Investment
      Description\\n\\nThe Trigger Autocallable Contingent Yield Notes (the \\\"Notes\\\")
      linked to the S&amp;P 500 \xAE Index (the \\\"Underlying\\\") are senior unsecured
      obligations issued by BofA Finance LLC (\\\"BofA Finance\\\"), a direct, wholly-owned
      subsidiary of Bank of America Corporation (\\\"BAC\\\" or the \\\"Guarantor\\\"),
