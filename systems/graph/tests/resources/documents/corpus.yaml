- file: papers/arxiv-2505.24250.pdf
  family: paper
  sha256: "2d068bfcc6970e5b1b6aefc1d1c9910c4227fdf7b54cdde6107c89e633a775d6"
  source: "https://arxiv.org/abs/2505.24250"
  license: "http://creativecommons.org/licenses/by/4.0/"
  truth:
    arxiv: "2505.24250"
    title: "Winners vs. Losers: Momentum-based Strategies with Intertemporal Choice for ESG Portfolios"
    authors:
    - Ayush Jha
    - Abootaleb Shirvani
    - Ali Jaffri
    - Svetlozar T. Rachev
    - Frank J. Fabozzi
    categories:
    - econ.GN
    - q-fin.EC
    submitted: "2025-05-30"
    abstract: This paper introduces a state-dependent momentum framework that integrates ESG regime switching with tail-risk-aware reward-risk metrics. Using a dynamic programming approach and solving a finite-horizon Bellman equation, we construct long-short momentum portfolios that adjust to changing ESG sentiment regimes. Unlike traditional momentum strategies based on historical returns, our approach incorporates the Stable Tail Adjusted Return ratio and Rachev ratio to better capture downside risk in turbulent markets. We apply this framework across three asset classes, Russell 3000 equities, Dow Jones~30 stocks, and cryptocurrencies, under both pro- and anti-ESG market regimes. We find that ESG-loser portfolios significantly outperform ESG-winner portfolios in pro-ESG regimes, a counterintuitive result suggesting that market overreaction to ESG sentiment creates short-term pricing inefficiencies. This pattern is robust across tail-sensitive performance metrics and is most pronounced under a two-week formation and holding period. Our framework highlights how ESG considerations and sentiment regimes alter return dynamics, offering practical guidance for investors seeking to implement responsive momentum strategies under sustainability constraints. These findings challenge conventional assumptions about ESG investing and underscore the importance of dynamic, regime-aware portfolio construction in environments shaped by regulatory signals, investor flows, and behavioral biases.
- file: papers/arxiv-2309.05783.pdf
  family: paper
  sha256: a1fd136fd09165a5068554a151b23b407a4d6c169c2eb08f74d7ad6122bc722f
  source: "https://arxiv.org/abs/2309.05783"
  license: "http://creativecommons.org/licenses/by/4.0/"
  truth:
    arxiv: "2309.05783"
    title: A New Framework to Estimate Return on Investment for Player Salaries in the National Basketball Association
    authors:
    - Jackson P. Lautier
    categories:
    - q-fin.GN
    - stat.AP
    submitted: "2023-09-11"
    abstract: "The National Basketball Association (NBA) imposes a player salary cap. It is therefore useful to develop tools to measure the relative realized return of a player&#39;s salary given their on court performance. Very few such studies exist, however. We thus present the first known framework to estimate a return on investment (ROI) for NBA player contracts. The framework operates in five parts: (1) decide on a measurement time horizon, such as the standard 82-game NBA regular season; (2) calculate the novel game contribution percentage (GCP) measure we propose, which is a single game summary statistic that sums to unity for each competing team and is comprised of traditional, playtype, hustle, box outs, defensive, tracking, and rebounding per game NBA statistics; (3) estimate the single game value (SGV) of each regular season NBA game using a standard currency conversion calculation; (4) multiply the SGV by the vector of realized GCPs to obtain a series of realized per-player single season cash flows; and (5) use the player salary as an initial investment to perform the traditional ROI calculation. We illustrate our framework by compiling a novel, sharable dataset of per game GCP statistics and salaries for the 2022-2023 NBA regular season. A scatter plot of ROI by salary for all players is presented, including the top and bottom 50 performers. Notably, missed games are treated as defaults because GCP is a per game metric. This allows for break-even calculations between high-performing players with frequent missed games and average performers with few missed games, which we demonstrate with a comparison of the 2023 NBA regular seasons of Anthony Davis and Brook Lopez. We conclude by suggesting uses of our framework, discussing its flexibility through customization, and outlining potential future improvements."
- file: papers/arxiv-2402.01820.pdf
  family: paper
  sha256: "77d3e9da49efbaf7631304bdabd86c495c4c9c99f14762df9309a042425b5a8a"
  source: "https://arxiv.org/abs/2402.01820"
  license: "http://creativecommons.org/licenses/by/4.0/"
  truth:
    arxiv: "2402.01820"
    title: "Signature volatility models: pricing and hedging with Fourier"
    authors:
    - Eduardo Abi Jaber
    - Louis-Amand Gérard
    categories:
    - q-fin.PR
    submitted: "2025-06-02"
    abstract: We consider a stochastic volatility model where the dynamics of the volatility are given by a possibly infinite linear combination of the elements of the time extended signature of a Brownian motion. First, we show that the model is remarkably universal, as it includes, but is not limited to, the celebrated Stein-Stein, Bergomi, and Heston models, together with some path-dependent variants. Second, we derive the joint characteristic functional of the log-price and integrated variance provided that some infinite dimensional extended tensor algebra valued Riccati equation admits a solution. This allows us to price and (quadratically) hedge certain European and path-dependent options using Fourier inversion techniques. We highlight the efficiency and accuracy of these Fourier techniques in a comprehensive numerical study.
