name: release

# Git-first: the tag IS the version (uv-dynamic-versioning). Nothing is published by a merge —
# the gates in .github/ci.vars.example decide what a repo is. Generated from infra/, do not edit.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when tag is set)
        type: choice
        default: patch
        options: [patch, minor, major]
      tag:
        description: Republish an existing v* tag verbatim (empty = cut a new version)
        type: string
        default: ""


concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # feature: pypi
  bump:
    name: Version + tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.tag }}
        run: |
          if [ -n "$GIVEN" ]; then echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            IFS=. read -r M m p <<< "$(git describe --tags --abbrev=0 | sed 's/^v//')"
            case "$BUMP" in
              major) M=$((M+1)); m=0; p=0 ;;
              minor) m=$((m+1)); p=0 ;;
              *) p=$((p+1)) ;;
            esac
          else
            M=0; m=1; p=0
          fi
          echo "tag=v$M.$m.$p" >> "$GITHUB_OUTPUT"
      - name: Push tag and open the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$GH_TOKEN" | base64 -w0)" push origin "$TAG"
          gh release create "$TAG" --latest --verify-tag --generate-notes || gh release edit "$TAG" --latest=true

  # feature: pypi
  build:
    name: sdist + wheel
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Build (version resolved from the checked-out tag)
        run: uv build
      - name: Smoke — install the wheel in a clean env and import
        shell: bash
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import e_mcp"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

  # feature: pypi
  publish:
    name: publish
    if: vars.PUBLISH_PYPI == 'true'
    needs: [bump, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e-mcp/${{ needs.bump.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  # feature: image
  image:
    name: Container image → ghcr
    needs: bump
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991e38e31fa1556316c9a45dbf86b2b346d  # v4.4.1
      - uses: docker/login-action@dbcb81380d4f07eb25cbe814f20e043c6a77fa2c  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc80280459580a9a1a9f2f35b687fc1de3962feb  # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-mcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263f895c5ce87a07f344583362abcd1b463  # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

