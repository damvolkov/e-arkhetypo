services:

  e-mcp:
    image: ghcr.io/damvolkov/e-mcp:latest
    container_name: e-mcp
    hostname: e-mcp
    restart: unless-stopped
    labels:
      e-core.category: "mcp"
      e-core.port: "45200"
    ports:
      # 45200 — the MCP endpoint: loopback only until a caller needs more
      - "127.0.0.1:45200:45200"
    environment:
      - MCP_TOKEN=${MCP_TOKEN:-}
      - APP_ENV=prod
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 45200), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
